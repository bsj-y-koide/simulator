<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MTF Trading Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.5/dist/umd/klinecharts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #131722; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

#toolbar {
  background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0;
  display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 11px;
}
#toolbar button {
  border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff;
  padding: 4px 10px; font-size: 12px; min-height: 28px;
  -webkit-tap-highlight-color: transparent;
}
#toolbar select {
  background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
  padding: 2px 4px; font-size: 11px; min-height: 24px;
}
#btn-buy { background: #1565c0; }
#btn-sell { background: #b71c1c; }
#btn-close { background: #444; font-size: 11px; }
.tool-btn { background: #333; }
.tool-btn.active { background: #e65100; }
#btn-play { background: #1b5e20; min-width: 28px; }
#speed-wrap { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #888; }
input[type=range] { width: 60px; accent-color: #26a69a; }
#pnl-float, #pnl-total { font-size: 11px; font-weight: bold; white-space: nowrap; }
#pos-info { color: #aaa; font-size: 10px; margin-left: auto; }

#chart-grid {
  flex: 1; display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 1px; background: #333; min-height: 0;
}
.chart-pane {
  background: #131722; position: relative; overflow: hidden;
}
.chart-pane .tf-label {
  position: absolute; top: 4px; left: 6px; z-index: 5;
  font-size: 12px; font-weight: bold; color: #fff; background: #1a1a1acc;
  padding: 2px 6px; border-radius: 3px;
}
.chart-inner { width: 100%; height: 100%; }
.chart-pane.active { outline: 1px solid #f57f17; }

#positions {
  background: #111; border-top: 1px solid #222;
  padding: 3px 8px; font-size: 11px; min-height: 20px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex-shrink: 0;
}
</style>
</head>
<body>

<div id="toolbar">
  <a href="index.html" style="background:#21262d;color:#e6edf3;font-size:10px;text-decoration:none;padding:2px 6px;border-radius:4px;border:1px solid #30363d">TOP</a>
  <span id="pnl-float">含み: ±0</span>
  <span id="pnl-total">確定+含み: ±0</span>
  <button id="btn-play">▶</button>
  <div id="speed-wrap">速<input type="range" id="speed" min="1" max="10" value="3"></div>
  <select id="lot" title="ロット">
    <option>0.01</option><option>0.05</option><option selected>0.1</option>
    <option>0.5</option><option>1.0</option>
  </select>
  <button id="btn-sell">SELL</button>
  <button id="btn-buy">BUY</button>
  <button id="btn-close">CLOSE</button>
  <button class="tool-btn" data-tool="fibo" style="font-size:11px;min-width:32px">fb</button>
  <button class="tool-btn" data-tool="hline" style="font-size:14px;min-width:32px">ー</button>
  <button class="tool-btn" data-tool="tline" style="font-size:14px;min-width:32px">/</button>
  <button id="btn-tool-clear" style="background:#444;font-size:12px;min-height:28px;min-width:28px;border:none;border-radius:4px;color:#fff;cursor:pointer">✕</button>
  <button id="btn-settings" style="font-size:14px;min-width:32px;background:#2a2a3a;border:none;border-radius:4px;color:#fff;cursor:pointer;min-height:28px">⚙</button>
  <span id="pos-info"></span>
</div>

<!-- 設定パネル -->
<div id="ma-panel" style="display:none;position:fixed;top:60px;right:8px;background:#161b22;border:1px solid #30363d;border-radius:8px;z-index:200;padding:12px;font-size:13px;min-width:220px;max-height:80vh;overflow-y:auto">
  <div style="display:flex;gap:6px;margin-bottom:10px;position:sticky;top:-12px;background:#161b22;padding:4px 0 8px;z-index:1">
    <button id="ma-apply" style="flex:1;background:#1565c0;color:#fff;border:none;border-radius:4px;padding:6px;font-size:12px;cursor:pointer;min-height:30px">適用</button>
  </div>
  <div style="font-weight:bold;margin-bottom:8px">MA設定</div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
    <span style="font-size:11px;color:#aaa">期間:</span>
    <input id="ma-p1" type="number" min="1" max="999" value="20" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
    <input id="ma-p2" type="number" min="1" max="999" value="50" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
    <input id="ma-p3" type="number" min="1" max="999" value="200" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
  </div>
  <div style="border-top:1px solid #21262d;margin-top:12px;padding-top:10px">
    <div style="font-weight:bold;margin-bottom:8px">自動TP/SL</div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="auto-tpsl-toggle" style="accent-color:#76ff03">
      <span>エントリー時に自動設定</span>
    </label>
    <div id="auto-tpsl-settings" style="display:none;padding-left:24px;font-size:11px;color:#8b949e">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="color:#76ff03;min-width:20px">TP</span>
        <input id="auto-tp-pips" type="number" min="1" max="999" value="30" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
        <span>pips</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#ff5252;min-width:20px">SL</span>
        <input id="auto-sl-pips" type="number" min="1" max="999" value="30" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
        <span>pips</span>
      </div>
    </div>
  </div>
</div>

<div id="chart-grid">
  <div class="chart-pane"><span class="tf-label">4H</span><div class="chart-inner" id="chart-240"></div></div>
  <div class="chart-pane"><span class="tf-label">1H</span><div class="chart-inner" id="chart-60"></div></div>
  <div class="chart-pane"><span class="tf-label">15m</span><div class="chart-inner" id="chart-15"></div></div>
  <div class="chart-pane"><span class="tf-label">5m</span><div class="chart-inner" id="chart-5"></div></div>
</div>

<div id="positions">ポジションなし</div>

<script>
// ===== MTF シミュレーター =====
const TFS = [240, 60, 15, 5];
const CHART_STYLES = {
  candle: {
    bar: { upColor: '#26a69a', downColor: '#ef5350', upBorderColor: '#26a69a', downBorderColor: '#ef5350', upWickColor: '#26a69a', downWickColor: '#ef5350' },
    priceMark: { last: { show: false, line: { show: false }, text: { show: false } } },
    tooltip: { showRule: 'none' }
  },
  grid: { horizontal: { color: '#2a2a3a' }, vertical: { color: '#2a2a3a' } },
  crosshair: { show: true, text: { show: false } },
  xAxis: { tickText: { color: '#aaa' } },
  yAxis: { tickText: { color: '#aaa' } },
};

// チャート作成
const charts = {};
TFS.forEach(tf => {
  const el = document.getElementById(`chart-${tf}`);
  charts[tf] = klinecharts.init(el, { styles: CHART_STYLES });
  charts[tf].createIndicator('MA', false, { id: 'candle_pane' });
  charts[tf].overrideIndicator({ name: 'MA', calcParams: [20, 50, 200] }, 'candle_pane');
  new ResizeObserver(() => charts[tf].resize()).observe(el);
});

// データ
var bars1m = [];
var curIdx1m = 200;
var livePrice = 0;
var playing = false;
var timer = null;

// 集計
function aggregateBars(bars, tfMin) {
  if (tfMin === 1) return bars;
  const tfSec = tfMin * 60;
  const result = [];
  let cur = null;
  for (const b of bars) {
    const bucket = Math.floor(b.t / tfSec) * tfSec;
    if (!cur || cur.t !== bucket) {
      if (cur) result.push(cur);
      cur = { t: bucket, o: b.o, h: b.h, l: b.l, c: b.c };
    } else {
      if (b.h > cur.h) cur.h = b.h;
      if (b.l < cur.l) cur.l = b.l;
      cur.c = b.c;
    }
  }
  if (cur) result.push(cur);
  return result;
}

function toKLine(b) {
  return { timestamp: b.t * 1000, open: b.o, high: b.h, low: b.l, close: b.c, volume: 0 };
}

function renderAllCharts() {
  const maBuffer = 200 * 240; // 4h MA200用
  const displayBars = 2000;
  const startFrom = Math.max(0, curIdx1m - (maBuffer + displayBars));
  const slice = bars1m.slice(startFrom, curIdx1m + 1);

  TFS.forEach(tf => {
    const visible = aggregateBars(slice, tf).map(toKLine);
    charts[tf].applyNewData(visible);
  });

  livePrice = bars1m[curIdx1m]?.c || 0;
  updatePnL(livePrice);
}

// データ読み込み
const DB_NAME = 'TradingSimDB';
const DB_VER = 3;
let db = null;

function openDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('trades')) { const ts = d.createObjectStore('trades', { keyPath: 'id', autoIncrement: true }); ts.createIndex('sessionId', 'sessionId'); ts.createIndex('closeTime', 'closeTime'); }
      if (!d.objectStoreNames.contains('sessions')) { const ss = d.createObjectStore('sessions', { keyPath: 'id' }); ss.createIndex('startDate', 'startDate'); }
      if (!d.objectStoreNames.contains('dataCache')) { d.createObjectStore('dataCache', { keyPath: 'id' }); }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
  });
}

(async () => {
  await openDB();
  let data = null;
  if (db && db.objectStoreNames.contains('dataCache')) {
    data = await new Promise(r => {
      const req = db.transaction('dataCache','readonly').objectStore('dataCache').get('bars1m');
      req.onsuccess = () => r(req.result?.data || null);
      req.onerror = () => r(null);
    });
  }
  if (!data) {
    const raw = await fetch('ohlc_1m.json.gz').then(r => new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json());
    data = [];
    for (let i = 0; i < raw.length; i += 5) {
      data.push({ t: raw[i], o: raw[i+1], h: raw[i+2], l: raw[i+3], c: raw[i+4] });
    }
    if (db && db.objectStoreNames.contains('dataCache')) {
      try { db.transaction('dataCache','readwrite').objectStore('dataCache').put({ id: 'bars1m', data }); } catch(e) {}
    }
  }
  bars1m = data;

  // ランダム開始
  const PAST_BARS = 220000;
  const dayStarts = [];
  let lastDate = '';
  for (let i = 0; i < bars1m.length; i++) {
    const d = new Date(bars1m[i].t * 1000);
    const dateStr = d.toISOString().slice(0, 10);
    if (dateStr !== lastDate && d.getUTCHours() >= 0 && d.getUTCHours() <= 2) {
      dayStarts.push(i);
      lastDate = dateStr;
    }
  }
  const candidates = dayStarts.filter(i => i >= PAST_BARS && i + 1440 < bars1m.length);
  curIdx1m = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : Math.min(PAST_BARS, bars1m.length - 1);

  renderAllCharts();
})();

// ===== 再生 =====
const btnPlay = document.getElementById('btn-play');
const speedEl = document.getElementById('speed');

function getBarDelay(spd) {
  return [8000,5000,3000,1500,600,250,100,50,25,10][spd - 1];
}

function startPlay() {
  function tick() {
    if (curIdx1m + 1 >= bars1m.length - 1) { stopPlay(); playing = false; btnPlay.textContent = '▶︎'; return; }
    const spd = parseInt(speedEl.value);
    curIdx1m++;
    const bar = bars1m[curIdx1m];
    livePrice = bar.c;

    // 各チャートの最後のバーを更新
    TFS.forEach(tf => {
      const tfSec = tf * 60;
      const bucket = Math.floor(bar.t / tfSec) * tfSec;
      // 現在のTFバーを計算
      let tfBar = { t: bucket, o: bar.o, h: bar.h, l: bar.l, c: bar.c };
      for (let j = curIdx1m - 1; j >= 0; j--) {
        if (Math.floor(bars1m[j].t / tfSec) * tfSec !== bucket) break;
        tfBar.o = bars1m[j].o;
        if (bars1m[j].h > tfBar.h) tfBar.h = bars1m[j].h;
        if (bars1m[j].l < tfBar.l) tfBar.l = bars1m[j].l;
      }
      charts[tf].updateData(toKLine(tfBar));
    });

    updatePnL(livePrice);
    checkTPSLAndLimits(livePrice);

    if (playing) timer = setTimeout(tick, getBarDelay(spd));
  }
  timer = setTimeout(tick, 0);
}

function stopPlay() { clearTimeout(timer); timer = null; }

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? '⏸︎' : '▶︎';
  if (playing) startPlay(); else stopPlay();
});

speedEl.addEventListener('input', () => { if (playing) { stopPlay(); startPlay(); } });

// ===== ポジション管理 =====
var positions = [];
var posId = 0;
var realizedPnL = 0;
var tradeHistory = [];
var pendingOrders = [];
const HALF_SPREAD = 0.2;
const PIP = 0.1;
const JPY_RATE = 160;
var autoTPSL = JSON.parse(localStorage.getItem('autoTPSL') || '{"enabled":false,"tp":30,"sl":30}');
var tpslCooldown = 0;
var tpslDrag = null;

function getLot() { return parseFloat(document.getElementById('lot').value); }
function fmtJpy(v) { const jpy = v * JPY_RATE; return `${jpy >= 0 ? '+' : ''}${Math.round(jpy).toLocaleString()}円`; }

function openPosition(type) {
  const mid = livePrice || bars1m[curIdx1m].c;
  const price = type === 'BUY' ? mid + HALF_SPREAD : mid - HALF_SPREAD;
  let tp = null, sl = null;
  if (autoTPSL.enabled) {
    const tpDist = autoTPSL.tp * PIP, slDist = autoTPSL.sl * PIP;
    if (type === 'BUY') { tp = price + tpDist; sl = price - slDist; }
    else { tp = price - tpDist; sl = price + slDist; }
  }
  positions.push({ id: ++posId, type, price, lot: getLot(), tp, sl, entryTime: new Date(bars1m[curIdx1m].t * 1000).toISOString(), entryIdx: curIdx1m });
  updatePnL(mid);
}

document.getElementById('btn-buy').addEventListener('click', () => openPosition('BUY'));
document.getElementById('btn-sell').addEventListener('click', () => openPosition('SELL'));
document.getElementById('btn-close').addEventListener('click', () => {
  const mid = livePrice || bars1m[curIdx1m].c;
  for (const p of positions) {
    const cur = p.type === 'BUY' ? mid - HALF_SPREAD : mid + HALF_SPREAD;
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    realizedPnL += diff * p.lot * 100;
  }
  positions = [];
  updatePnL(mid);
});

function checkTPSLAndLimits(mid) {
  if (tpslCooldown > Date.now()) return;
  const toClose = [];
  positions.forEach(p => {
    let hit = false;
    if (!hit && p.tp !== null) {
      if (p.type === 'BUY' && mid >= p.tp) { toClose.push({ pos: p, closePrice: p.tp - HALF_SPREAD, reason: 'TP' }); hit = true; }
      if (p.type === 'SELL' && mid <= p.tp) { toClose.push({ pos: p, closePrice: p.tp + HALF_SPREAD, reason: 'TP' }); hit = true; }
    }
    if (!hit && p.sl !== null) {
      if (p.type === 'BUY' && mid <= p.sl) { toClose.push({ pos: p, closePrice: p.sl - HALF_SPREAD, reason: 'SL' }); hit = true; }
      if (p.type === 'SELL' && mid >= p.sl) { toClose.push({ pos: p, closePrice: p.sl + HALF_SPREAD, reason: 'SL' }); hit = true; }
    }
  });
  toClose.forEach(({ pos, closePrice }) => {
    const diff = pos.type === 'BUY' ? closePrice - pos.price : pos.price - closePrice;
    realizedPnL += diff * pos.lot * 100;
    positions = positions.filter(pp => pp.id !== pos.id);
  });
  if (toClose.length > 0) updatePnL(mid);
}

function calcFloat(mid) {
  let f = 0;
  for (const p of positions) {
    const cur = p.type === 'BUY' ? mid - HALF_SPREAD : mid + HALF_SPREAD;
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    f += diff * p.lot * 100;
  }
  return f;
}

function updatePnL(cur) {
  const floatPnL = calcFloat(cur);
  const totalPnL = realizedPnL + floatPnL;
  const fe = document.getElementById('pnl-float');
  fe.textContent = `含み: ${fmtJpy(floatPnL)}`;
  fe.style.color = floatPnL >= 0 ? '#26a69a' : '#ef5350';
  const te = document.getElementById('pnl-total');
  te.textContent = `確定+含み: ${fmtJpy(totalPnL)}`;
  te.style.color = totalPnL >= 0 ? '#26a69a' : '#ef5350';

  const el = document.getElementById('positions');
  const info = document.getElementById('pos-info');
  if (positions.length === 0) {
    el.innerHTML = `<span style="color:#666">ポジションなし</span>　<span style="color:#aaa">確定: ${fmtJpy(realizedPnL)}</span>`;
    info.textContent = '';
    return;
  }
  el.innerHTML = positions.map(p => {
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    const pnl = diff * p.lot * 100;
    return `<span style="color:${pnl>=0?'#26a69a':'#ef5350'}">[${p.id}] ${p.type} ${p.lot} @ ${p.price.toFixed(2)} → ${fmtJpy(pnl)}</span>`;
  }).join('  ') + `　<span style="color:#aaa;font-size:11px">確定累計: ${fmtJpy(realizedPnL)}</span>`;
  info.textContent = `${positions.length}件`;
}

// ===== Canvas オーバーレイ（全チャート共通） =====
const overlays = {};
TFS.forEach(tf => {
  const pane = document.getElementById(`chart-${tf}`);
  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, { position:'absolute', top:'0', left:'0', pointerEvents:'none', zIndex:'10' });
  pane.appendChild(canvas);
  overlays[tf] = { canvas, ctx: canvas.getContext('2d'), pane };

  new ResizeObserver(() => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = pane.clientWidth * dpr;
    canvas.height = pane.clientHeight * dpr;
    canvas.style.width = pane.clientWidth + 'px';
    canvas.style.height = pane.clientHeight + 'px';
    overlays[tf].ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }).observe(pane);
});

function priceToYForChart(chart, price) {
  try {
    const r = chart.convertToPixel({ value: price }, { paneId: 'candle_pane', absolute: true });
    return r ? r.y : null;
  } catch(e) { return null; }
}

// 描画ツール共有
var hlineSaved = [];
var fiboSaved = [];
var tlineSaved = [];
const FIBO_LEVELS = [0, 1.0, 1.236, 1.382, 1.618, 1.764, 2.0, 2.618];

function drawOverlays() {
  const mid = livePrice || bars1m[curIdx1m]?.c || 0;
  const bid = mid - HALF_SPREAD;
  const ask = mid + HALF_SPREAD;

  TFS.forEach(tf => {
    const { ctx, pane } = overlays[tf];
    const ch = charts[tf];
    const w = pane.clientWidth, h = pane.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // Bid/Ask ライン
    const bidY = priceToYForChart(ch, bid);
    const askY = priceToYForChart(ch, ask);
    [{ price: bid, color: '#ef5350', y: bidY }, { price: ask, color: '#26a69a', y: askY }].forEach(({ price, color, y }) => {
      if (y === null || y < 0 || y > h) return;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 0.5; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.restore();
    });
    // ラベル
    if (bidY !== null && askY !== null) {
      ctx.save();
      ctx.font = 'bold 9px monospace';
      const lblH = 11;
      const gap = Math.abs(bidY - askY);
      if (gap < 3) {
        // 近すぎる場合は中間価格1つだけ表示
        const midPrice = (bid + ask) / 2;
        const midY = (bidY + askY) / 2;
        const lbl = midPrice.toFixed(2);
        const tw = ctx.measureText(lbl).width;
        ctx.fillStyle = '#26a69a';
        ctx.fillRect(w - tw - 4, midY - 5, tw + 4, lblH);
        ctx.fillStyle = '#fff';
        ctx.fillText(lbl, w - tw - 2, midY + 3);
      } else {
        let by = bidY, ay = askY;
        if (gap < lblH + 2) {
          const mid2 = (by + ay) / 2;
          ay = mid2 - lblH / 2 - 1;
          by = mid2 + lblH / 2 + 1;
        }
        [{ price: bid, color: '#ef5350', y: by }, { price: ask, color: '#26a69a', y: ay }].forEach(({ price, color, y }) => {
          const lbl = price.toFixed(2);
          const tw = ctx.measureText(lbl).width;
          ctx.fillStyle = color;
          ctx.fillRect(w - tw - 4, y - 5, tw + 4, lblH);
          ctx.fillStyle = '#fff';
          ctx.fillText(lbl, w - tw - 2, y + 3);
        });
      }
      ctx.restore();
    }

    // ポジションライン
    positions.forEach(p => {
      const y = priceToYForChart(ch, p.price);
      if (y === null || y < 0 || y > h) return;
      const isBuy = p.type === 'BUY';
      const diff = isBuy ? mid - p.price : p.price - mid;
      const profit = diff >= 0;
      ctx.save();
      ctx.strokeStyle = isBuy ? '#42a5f5' : '#ef5350';
      ctx.lineWidth = 1.5; ctx.setLineDash([6,4]); ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 0.9;
      ctx.font = 'bold 10px monospace';
      const pnl = diff * p.lot * 100;
      const label = `${p.type} ${fmtJpy(pnl)}`;
      const tw = ctx.measureText(label).width;
      const lx = (w - tw) / 2 - 4;
      ctx.fillStyle = profit ? '#1b5e20cc' : '#b71c1ccc';
      ctx.fillRect(lx, y - 12, tw + 8, 14);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, lx + 4, y - 1);
      ctx.restore();

      // TP/SL
      if (p.tp !== null) {
        const ty = priceToYForChart(ch, p.tp);
        if (ty !== null) { ctx.save(); ctx.strokeStyle = '#76ff03'; ctx.lineWidth = 1; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(w, ty); ctx.stroke(); ctx.setLineDash([]); ctx.font = '9px monospace'; ctx.fillStyle = '#76ff03'; ctx.fillText('TP', 4, ty - 2); ctx.restore(); }
      }
      if (p.sl !== null) {
        const sy = priceToYForChart(ch, p.sl);
        if (sy !== null) { ctx.save(); ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke(); ctx.setLineDash([]); ctx.font = '9px monospace'; ctx.fillStyle = '#ff5252'; ctx.fillText('SL', 4, sy - 2); ctx.restore(); }
      }
    });

    // 水平線
    hlineSaved.forEach(hl => {
      const y = priceToYForChart(ch, hl.price);
      if (y === null || y < 0 || y > h) return;
      ctx.save();
      ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.font = 'bold 9px monospace'; ctx.fillStyle = '#ffeb3b';
      ctx.fillText(hl.price.toFixed(2), 4, y - 2);
      ctx.restore();
    });

    // フィボナッチ（保存済み）
    fiboSaved.forEach(f => {
      _drawFiboOnCtx(ctx, ch, w, h, f.p1, f.p2, f.t1, f.t2, tf, 1.0);
    });

    // フィボナッチ（ドラッグ中、アクティブチャートのみ）
    if (typeof fiboDrag !== 'undefined' && fiboDrag && tf === activeChartTF) {
      _drawFiboOnCtx(ctx, ch, w, h, fiboDrag.p1, fiboDrag.p2, fiboDrag.t1, fiboDrag.t2, tf, 0.5);
    }

    // トレンドライン（保存済み）
    tlineSaved.forEach(f => {
      _drawTLineOnCtx(ctx, ch, w, h, f.p1, f.p2, f.t1, f.t2, tf, 1.0);
    });

    // トレンドライン（ドラッグ中、アクティブチャートのみ）
    if (typeof tlineDrag !== 'undefined' && tlineDrag && tf === activeChartTF) {
      _drawTLineOnCtx(ctx, ch, w, h, tlineDrag.p1, tlineDrag.p2, tlineDrag.t1, tlineDrag.t2, tf, 0.5);
    }
  });
}

function _timeToXOnChart(tf, ts) {
  try {
    const r = charts[tf].convertToPixel({ timestamp: ts }, { paneId: 'candle_pane', absolute: true });
    return (r?.x !== undefined && r.x !== null) ? r.x : null;
  } catch(e) { return null; }
}

function _drawFiboOnCtx(ctx, ch, w, h, p1, p2, t1, t2, tf, alpha) {
  const range = Math.abs(p1 - p2);
  const isDown = p1 >= p2;
  const xa = _timeToXOnChart(tf, t1);
  const xb = _timeToXOnChart(tf, t2);
  const xL = Math.min(xa ?? 0, xb ?? w);
  const xR = Math.max(xa ?? 0, xb ?? w);

  FIBO_LEVELS.forEach(lvl => {
    const price = isDown ? (p2 + range * lvl) : (p2 - range * lvl);
    const y = priceToYForChart(ch, price);
    if (y === null || y < 0 || y > h) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(xL, y); ctx.lineTo(xR, y); ctx.stroke();
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace';
    const labelText = lvl === 0 ? '' : `${lvl}`;
    const labelY = isDown ? y - 3 : y + 11;
    ctx.fillText(labelText, Math.min(xR + 4, w - 80), labelY);
    ctx.restore();
  });
}

function _drawTLineOnCtx(ctx, ch, w, h, p1, p2, t1, t2, tf, alpha) {
  const x1 = _timeToXOnChart(tf, t1);
  const x2 = _timeToXOnChart(tf, t2);
  const y1 = priceToYForChart(ch, p1);
  const y2 = priceToYForChart(ch, p2);
  if (x1 === null || x2 === null || y1 === null || y2 === null) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

setInterval(drawOverlays, 100);

// ===== アクティブチャート =====
var activeChartTF = 5;
document.querySelectorAll('.chart-pane').forEach(pane => {
  pane.addEventListener('mousedown', e => {
    // 描画ツールがアクティブな場合はアクティブチャート切替のみ（ドラッグ処理で使うため）
    const tf = parseInt(pane.querySelector('.chart-inner').id.replace('chart-', ''));
    activeChartTF = tf;
    document.querySelectorAll('.chart-pane').forEach(p => p.style.outline = 'none');
    pane.style.outline = '1px solid #f57f17';
  });
});

// ===== 描画ツール =====
var curTool = '';
var fiboActive = false;
var fiboDrag = null;
var tlineDrag = null;
var dragging = false;
var dragStartPrice = null;
var dragStartTime = null;
var dragStartX = null;

var toolBtns = document.querySelectorAll('.tool-btn');

function enableDrawTool(tool) {
  curTool = tool;
  fiboActive = true;
  // アクティブチャートのoverlayにpointerEvents設定 + zIndex上げ
  TFS.forEach(tf => {
    const isActive = tf === activeChartTF;
    overlays[tf].canvas.style.pointerEvents = isActive ? 'auto' : 'none';
    overlays[tf].canvas.style.cursor = isActive ? 'crosshair' : 'default';
    overlays[tf].canvas.style.zIndex = isActive ? '50' : '10';
  });
  toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === curTool));
  // チャートスクロール/ズーム無効
  TFS.forEach(tf => { charts[tf].setScrollEnabled(false); charts[tf].setZoomEnabled(false); });
}

function disableDrawTool() {
  curTool = '';
  fiboActive = false;
  fiboDrag = null;
  tlineDrag = null;
  dragging = false;
  dragStartPrice = null;
  dragStartTime = null;
  dragStartX = null;
  TFS.forEach(tf => {
    overlays[tf].canvas.style.pointerEvents = 'none';
    overlays[tf].canvas.style.cursor = 'default';
    overlays[tf].canvas.style.zIndex = '10';
    charts[tf].setScrollEnabled(true);
    charts[tf].setZoomEnabled(true);
  });
  toolBtns.forEach(b => b.classList.remove('active'));
}

toolBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.tool;
    if (fiboActive && curTool === v) { disableDrawTool(); }
    else { enableDrawTool(v); }
  });
});

document.getElementById('btn-tool-clear').addEventListener('click', () => {
  hlineSaved = []; fiboSaved = []; tlineSaved = [];
  disableDrawTool();
  drawOverlays();
});

// アクティブチャートのcanvasでのドラッグ操作
function getActiveCanvas() { return overlays[activeChartTF]?.canvas; }

function pixelToPriceOnChart(tf, y) {
  try {
    const r = charts[tf].convertFromPixel({ x: 100, y }, { paneId: 'candle_pane', absolute: true });
    return (r && r.value !== undefined) ? r.value : null;
  } catch(e) { return null; }
}

function xToTimeOnChart(tf, x) {
  try {
    const r = charts[tf].convertFromPixel({ x, y: 100 }, { paneId: 'candle_pane', absolute: true });
    return r?.timestamp || null;
  } catch(e) { return null; }
}

function timeToXOnChart(tf, ts) {
  try {
    const r = charts[tf].convertToPixel({ timestamp: ts }, { paneId: 'candle_pane', absolute: true });
    return (r?.x !== undefined && r.x !== null) ? r.x : null;
  } catch(e) { return null; }
}

// canvas上のmousedownで描画開始
TFS.forEach(tf => {
  overlays[tf].canvas.addEventListener('mousedown', e => {
    if (!fiboActive || tf !== activeChartTF) return;
    e.preventDefault();
    if (curTool === 'hline') {
      const p = pixelToPriceOnChart(tf, e.offsetY);
      if (p !== null) {
        hlineSaved.push({ price: p });
        disableDrawTool();
        drawOverlays();
      }
    } else if (curTool === 'fibo' || curTool === 'tline') {
      const p = pixelToPriceOnChart(tf, e.offsetY);
      const t = xToTimeOnChart(tf, e.offsetX);
      if (p !== null && t !== null) {
        dragStartPrice = p;
        dragStartTime = t;
        dragStartX = e.offsetX;
        dragging = true;
      }
    }
  });
});

document.addEventListener('mousemove', e => {
  if (!fiboActive || !dragging) return;
  const canvas = getActiveCanvas();
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const p = pixelToPriceOnChart(activeChartTF, y) ?? dragStartPrice;
  const t = xToTimeOnChart(activeChartTF, x) ?? dragStartTime;
  if (curTool === 'tline') {
    tlineDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t, rx1: dragStartX, rx2: x };
  } else if (curTool === 'fibo') {
    fiboDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t, rx1: dragStartX, rx2: x };
  }
  drawOverlays();
});

document.addEventListener('mouseup', e => {
  if (!fiboActive || !dragging) return;
  const canvas = getActiveCanvas();
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (curTool === 'tline') {
    if (tlineDrag && Math.abs(tlineDrag.p2 - tlineDrag.p1) > 0.001) {
      tlineSaved.push({ p1: tlineDrag.p1, p2: tlineDrag.p2, t1: tlineDrag.t1, t2: tlineDrag.t2 });
    }
    tlineDrag = null;
  } else if (curTool === 'fibo') {
    if (fiboDrag && Math.abs(fiboDrag.p2 - fiboDrag.p1) > 0.001) {
      fiboSaved.push({ p1: fiboDrag.p1, p2: fiboDrag.p2, t1: fiboDrag.t1, t2: fiboDrag.t2 });
    }
    fiboDrag = null;
  }
  dragging = false;
  dragStartPrice = null;
  dragStartTime = null;
  dragStartX = null;
  disableDrawTool();
  drawOverlays();
});

// ===== 描画オブジェクトのヒットテスト (アクティブチャート基準) =====
function hitDrawObjectOnChart(tf, mx, my) {
  // 水平線
  for (let i = hlineSaved.length - 1; i >= 0; i--) {
    const y = priceToYForChart(charts[tf], hlineSaved[i].price);
    if (y !== null && Math.abs(my - y) < 10) return { type: 'hline', idx: i };
  }
  // トレンドライン
  for (let i = tlineSaved.length - 1; i >= 0; i--) {
    const f = tlineSaved[i];
    const x1 = timeToXOnChart(tf, f.t1), x2 = timeToXOnChart(tf, f.t2);
    const y1 = priceToYForChart(charts[tf], f.p1), y2 = priceToYForChart(charts[tf], f.p2);
    if (x1 === null || x2 === null || y1 === null || y2 === null) continue;
    const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
    const t = len2 > 0 ? Math.max(0, Math.min(1, ((mx-x1)*dx+(my-y1)*dy)/len2)) : 0;
    const px = x1+t*dx, py = y1+t*dy;
    if (Math.sqrt((mx-px)**2+(my-py)**2) < 10) return { type: 'tline', idx: i };
  }
  // フィボ
  for (let i = fiboSaved.length - 1; i >= 0; i--) {
    const f = fiboSaved[i];
    const xa = timeToXOnChart(tf, f.t1), xb = timeToXOnChart(tf, f.t2);
    if (xa === null || xb === null) continue;
    const xL = Math.min(xa, xb), xR = Math.max(xa, xb);
    if (mx < xL - 10 || mx > xR + 60) continue;
    const range = Math.abs(f.p1 - f.p2);
    const isDown = f.p1 >= f.p2;
    for (const lvl of FIBO_LEVELS) {
      const price = isDown ? (f.p2 + range * lvl) : (f.p2 - range * lvl);
      const y = priceToYForChart(charts[tf], price);
      if (y !== null && Math.abs(my - y) < 10) return { type: 'fibo', idx: i };
    }
  }
  return null;
}

// ===== 右クリック削除メニュー =====
const deleteMenu = document.createElement('div');
Object.assign(deleteMenu.style, {
  position: 'fixed', display: 'none', zIndex: '500',
  background: '#2b2b2b', border: '1px solid #4a4a4a', borderRadius: '2px',
  padding: '2px 0', boxShadow: '0 2px 8px rgba(0,0,0,0.7)',
  fontSize: '13px', color: '#ddd', minWidth: '120px'
});
const menuItemStyle = 'width:100%;background:none;padding:5px 20px;border:none;color:#ddd;font-size:13px;cursor:pointer;text-align:left;font-family:monospace;display:block';
deleteMenu.innerHTML = `<button id="dmenu-del" style="${menuItemStyle};color:#ff6b6b" onmouseover="this.style.background='#3d6a99'" onmouseout="this.style.background='none'">削除</button>`;
document.body.appendChild(deleteMenu);

var deleteTargetIdx = -1;
var deleteTargetType = '';
function showDeleteMenu(x, y, idx, type) {
  deleteTargetIdx = idx;
  deleteTargetType = type || '';
  deleteMenu.style.display = 'block';
  const mh = deleteMenu.offsetHeight, mw = deleteMenu.offsetWidth;
  deleteMenu.style.left = Math.min(x, window.innerWidth - mw - 4) + 'px';
  deleteMenu.style.top = Math.max(4, y - mh - 4) + 'px';
}
function hideDeleteMenu() { deleteMenu.style.display = 'none'; deleteTargetIdx = -1; deleteTargetType = ''; }

document.getElementById('dmenu-del').addEventListener('click', () => {
  if (deleteTargetIdx >= 0) {
    const col = deleteTargetType === 'hline' ? hlineSaved : deleteTargetType === 'tline' ? tlineSaved : fiboSaved;
    col.splice(deleteTargetIdx, 1);
    drawOverlays();
  }
  hideDeleteMenu();
});

document.addEventListener('mousedown', e => {
  if (!deleteMenu.contains(e.target)) hideDeleteMenu();
});

// 各チャートのpane上での右クリック（overlayはpointerEvents:noneなのでpaneに付ける）
TFS.forEach(tf => {
  overlays[tf].pane.addEventListener('contextmenu', e => {
    e.preventDefault();
    const rect = overlays[tf].pane.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const hit = hitDrawObjectOnChart(tf, mx, my);
    if (hit) showDeleteMenu(e.clientX, e.clientY, hit.idx, hit.type);
  });
});

// ===== 設定パネル =====
document.getElementById('btn-settings').addEventListener('click', () => {
  const panel = document.getElementById('ma-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});

// MA設定
var maPeriods = [20, 50, 200];
try {
  const saved = JSON.parse(localStorage.getItem('maPeriodsMTF'));
  if (Array.isArray(saved) && saved.length >= 3) maPeriods = saved;
} catch(e) {}

function applyMAMTF() {
  TFS.forEach(tf => {
    charts[tf].overrideIndicator({ name: 'MA', calcParams: maPeriods }, 'candle_pane');
  });
  localStorage.setItem('maPeriodsMTF', JSON.stringify(maPeriods));
}

document.getElementById('ma-p1').value = maPeriods[0];
document.getElementById('ma-p2').value = maPeriods[1];
document.getElementById('ma-p3').value = maPeriods[2];

document.getElementById('ma-apply').addEventListener('click', () => {
  maPeriods[0] = parseInt(document.getElementById('ma-p1').value) || 20;
  maPeriods[1] = parseInt(document.getElementById('ma-p2').value) || 50;
  maPeriods[2] = parseInt(document.getElementById('ma-p3').value) || 200;
  applyMAMTF();
  document.getElementById('ma-panel').style.display = 'none';
});

applyMAMTF();

// 自動TP/SL設定
document.getElementById('auto-tpsl-toggle').checked = autoTPSL.enabled;
document.getElementById('auto-tp-pips').value = autoTPSL.tp;
document.getElementById('auto-sl-pips').value = autoTPSL.sl;
document.getElementById('auto-tpsl-settings').style.display = autoTPSL.enabled ? 'block' : 'none';

document.getElementById('auto-tpsl-toggle').addEventListener('change', e => {
  autoTPSL.enabled = e.target.checked;
  document.getElementById('auto-tpsl-settings').style.display = autoTPSL.enabled ? 'block' : 'none';
  localStorage.setItem('autoTPSL', JSON.stringify(autoTPSL));
});
document.getElementById('auto-tp-pips').addEventListener('change', e => {
  autoTPSL.tp = parseInt(e.target.value) || 30;
  localStorage.setItem('autoTPSL', JSON.stringify(autoTPSL));
});
document.getElementById('auto-sl-pips').addEventListener('change', e => {
  autoTPSL.sl = parseInt(e.target.value) || 30;
  localStorage.setItem('autoTPSL', JSON.stringify(autoTPSL));
});

// 設定パネル外クリックで閉じる
document.addEventListener('click', e => {
  const panel = document.getElementById('ma-panel');
  if (panel.style.display === 'block' && !panel.contains(e.target) && e.target !== document.getElementById('btn-settings')) {
    panel.style.display = 'none';
  }
});

// ===== キーボード
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
  if (e.key === 'b' || e.key === 'B') document.getElementById('btn-buy').click();
  if (e.key === 's' || e.key === 'S') document.getElementById('btn-sell').click();
  if (e.key === 'Escape') disableDrawTool();
});
</script>
