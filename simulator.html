<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trading Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.5/dist/umd/klinecharts.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ツールバー2行 -->
<div id="toolbar">
  <div id="row1">
    <span id="cur-time" style="display:none">--</span>
    <span id="cur-price" style="display:none">--</span>
    <a href="index.html" style="background:#21262d;color:#e6edf3;font-size:11px;text-decoration:none;padding:3px 8px;border-radius:4px;border:1px solid #30363d">TOP</a>
    <span id="pnl-float">含み: ±0</span>
    <span id="pnl-total">確定+含み: ±0</span>
    <button id="btn-play">▶</button>
    <div id="speed-wrap">速<input type="range" id="speed" min="1" max="10" value="3"></div>
    <select id="tf-select">
      <option value="1">1m</option>
      <option value="5" selected>5m</option>
      <option value="15">15m</option>
      <option value="30">30m</option>
      <option value="60">1h</option>
      <option value="240">4h</option>
      <option value="1440">1d</option>
    </select>
    <select id="lot" title="ロット">
      <option>0.01</option><option>0.05</option><option selected>0.1</option>
      <option>0.5</option><option>1.0</option>
    </select>
  </div>
  <div id="row2">
    <button id="btn-sell">SELL</button>
    <button id="btn-buy">BUY</button>
    <button id="btn-close">CLOSE</button>
    <button class="tool-btn" data-tool="fibo" style="font-size:11px;min-width:32px">fb</button>
    <button class="tool-btn" data-tool="hline" style="font-size:14px;min-width:32px">ー</button>
    <button class="tool-btn" data-tool="tline" style="font-size:14px;min-width:32px">/</button>
    <button id="btn-tool-clear">✕</button>
    <button id="btn-settings" style="font-size:14px;min-width:32px;background:#2a2a3a">⚙</button>
    <span id="pos-info"></span>
  </div>
</div>

<!-- 設定パネル -->
<div id="ma-panel" style="display:none;position:fixed;top:60px;right:8px;background:#161b22;border:1px solid #30363d;border-radius:8px;z-index:200;padding:12px;font-size:13px;min-width:220px;max-height:80vh;overflow-y:auto">
  <div style="font-weight:bold;margin-bottom:8px">MA設定</div>
  <div id="ma-list"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <button id="ma-add" style="flex:1;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:4px;padding:6px;font-size:12px;cursor:pointer;min-height:30px">+ 追加</button>
    <button id="ma-apply" style="flex:1;background:#1565c0;color:#fff;border:none;border-radius:4px;padding:6px;font-size:12px;cursor:pointer;min-height:30px">適用</button>
  </div>
  <div style="border-top:1px solid #21262d;margin-top:12px;padding-top:10px">
    <div style="font-weight:bold;margin-bottom:8px">SMCインジケーター</div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="fvg-toggle" style="accent-color:#26a69a">
      <span>FVG（Fair Value Gap）</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="bos-toggle" style="accent-color:#ef5350">
      <span>BOS / CHoCH</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="ob-toggle" style="accent-color:#42a5f5">
      <span>Order Block</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="range-toggle" style="accent-color:#ff9800">
      <span>時間帯レンジ</span>
    </label>
    <div id="range-settings" style="display:none;margin-top:6px;padding-left:24px;font-size:11px;color:#8b949e">
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
        <span>開始</span>
        <input id="range-from" type="time" value="07:00" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px;font-size:11px">
        <span>〜</span>
        <input id="range-to" type="time" value="09:00" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px;font-size:11px">
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <span>終了</span>
        <input id="range-end" type="time" value="05:00" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px;font-size:11px">
        <span style="color:#484f58">（翌日）</span>
      </div>
    </div>
  </div>
  <div style="border-top:1px solid #21262d;margin-top:12px;padding-top:10px">
    <div style="font-weight:bold;margin-bottom:8px">自動TP/SL</div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="auto-tpsl-toggle" style="accent-color:#76ff03">
      <span>エントリー時に自動設定</span>
    </label>
    <div id="auto-tpsl-settings" style="display:none;padding-left:24px;font-size:11px;color:#8b949e">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="color:#76ff03;min-width:20px">TP</span>
        <input id="auto-tp-pips" type="number" min="1" max="999" value="30" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
        <span>pips</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#ff5252;min-width:20px">SL</span>
        <input id="auto-sl-pips" type="number" min="1" max="999" value="30" style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
        <span>pips</span>
      </div>
    </div>
  </div>
</div>

<!-- チャート -->
<div id="chart"></div>

<div id="positions">ポジションなし</div>

<script src="js/db.js"></script>
<script src="js/indicators.js"></script>
<script src="js/chart.js"></script>
<script src="js/trading.js"></script>
<script src="js/drawing.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
