<script>
// ===== カスタムMA（SMA/EMA混在対応） =====
let _maTypes = ['SMA','SMA','SMA']; // applyMAから更新される

klinecharts.registerIndicator({
  name: 'CustomMA',
  shortName: 'MA',
  calcParams: [20, 50, 200],
  figures: [],
  regenerateFigures: (params) => params.map((_, i) => ({
    key: `ma${i}`, title: `${(_maTypes[i]||'SMA')==='EMA'?'EMA':'MA'}${params[i]}: `, type: 'line'
  })),
  calc: (dataList, { calcParams }) => {
    const result = [];
    const emaMultipliers = calcParams.map(p => 2 / (p + 1));
    const emaPrev = new Array(calcParams.length).fill(null);

    for (let i = 0; i < dataList.length; i++) {
      const item = {};
      for (let j = 0; j < calcParams.length; j++) {
        const period = calcParams[j];
        const type = _maTypes[j] || 'SMA';
        if (type === 'EMA') {
          if (emaPrev[j] === null) {
            if (i >= period - 1) {
              let sum = 0;
              for (let k = i - period + 1; k <= i; k++) sum += dataList[k].close;
              emaPrev[j] = sum / period;
            }
          } else {
            emaPrev[j] = (dataList[i].close - emaPrev[j]) * emaMultipliers[j] + emaPrev[j];
          }
          item[`ma${j}`] = emaPrev[j];
        } else {
          if (i >= period - 1) {
            let sum = 0;
            for (let k = i - period + 1; k <= i; k++) sum += dataList[k].close;
            item[`ma${j}`] = sum / period;
          }
        }
      }
      result.push(item);
    }
    return result;
  }
});

// ===== チャート初期化 =====
const chart = klinecharts.init('chart', {
  styles: {
    candle: {
      bar: { upColor: '#26a69a', downColor: '#ef5350', upBorderColor: '#26a69a', downBorderColor: '#ef5350', upWickColor: '#26a69a', downWickColor: '#ef5350' },
      priceMark: { last: { show: false } },
      tooltip: { showRule: 'none' }
    },
    grid: { horizontal: { color: '#2a2a3a' }, vertical: { color: '#2a2a3a' } },
    crosshair: { show: true, text: { show: false }, horizontal: { show: true }, vertical: { show: true } },
    indicator: { tooltip: { showName: false, showParams: false } },
    xAxis: { tickText: { color: '#aaa' }, scrollZoomEnabled: true },
    yAxis: { tickText: { color: '#aaa' }, scrollZoomEnabled: true },
  }
});

// リサイズ対応
new ResizeObserver(() => chart.resize()).observe(document.getElementById('chart'));

// ===== データ読み込み =====
let bars1m   = [];  // 元の1分足（常に保持）
let curIdx1m = 200; // 常に bars1m のインデックス
let curTF    = 5;
let playing  = false;
let timer    = null;

// 1分足 → 任意時間足に集計
function aggregateBars(bars, tfMin) {
  if (tfMin === 1) return bars;
  const tfSec = tfMin * 60;
  const result = [];
  let cur = null;
  for (const b of bars) {
    const bucket = Math.floor(b.t / tfSec) * tfSec;
    if (!cur || cur.t !== bucket) {
      if (cur) result.push(cur);
      cur = { t: bucket, o: b.o, h: b.h, l: b.l, c: b.c };
    } else {
      if (b.h > cur.h) cur.h = b.h;
      if (b.l < cur.l) cur.l = b.l;
      cur.c = b.c;
    }
  }
  if (cur) result.push(cur);
  return result;
}

// 現在の1m位置から部分TFバーを返す
function getPartialBar(idx) {
  if (curTF === 1) return bars1m[idx];
  const tfSec = curTF * 60;
  const bucket = Math.floor(bars1m[idx].t / tfSec) * tfSec;
  let start = idx;
  while (start > 0 && Math.floor(bars1m[start-1].t / tfSec) * tfSec === bucket) start--;
  let bar = { t: bucket, o: bars1m[start].o, h: -Infinity, l: Infinity, c: bars1m[idx].c };
  for (let j = start; j <= idx; j++) {
    if (bars1m[j].h > bar.h) bar.h = bars1m[j].h;
    if (bars1m[j].l < bar.l) bar.l = bars1m[j].l;
  }
  return bar;
}

// ===== IndexedDB =====
const DB_NAME = 'TradingSimDB';
const DB_VER  = 3;
let db = null;
function openDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('trades')) {
        const ts = d.createObjectStore('trades', { keyPath: 'id', autoIncrement: true });
        ts.createIndex('sessionId', 'sessionId');
        ts.createIndex('closeTime', 'closeTime');
      }
      if (!d.objectStoreNames.contains('sessions')) {
        const ss = d.createObjectStore('sessions', { keyPath: 'id' });
        ss.createIndex('startDate', 'startDate');
      }
      if (!d.objectStoreNames.contains('dataCache')) {
        d.createObjectStore('dataCache', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => { console.error('DB error:', e.target.error); resolve(null); };
    req.onblocked = () => { console.warn('DB blocked'); resolve(null); };
  });
}
function dbPut(store, data) {
  if (!db) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}
function dbAdd(store, data) {
  if (!db) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add(data);
    req.onsuccess = () => resolve(req.result);
    tx.onerror = e => reject(e.target.error);
  });
}
function saveDrawings() {
  if (!db) return;
  const tx = db.transaction('sessions', 'readwrite');
  const store = tx.objectStore('sessions');
  const req = store.get(sessionId);
  req.onsuccess = () => {
    const s = req.result;
    if (s) {
      s.drawings = {
        fibo: fiboSaved.map(f => ({ p1:f.p1, p2:f.p2, t1:f.t1, t2:f.t2 })),
        hline: hlineSaved.map(h => ({ price:h.price })),
        tline: tlineSaved.map(f => ({ p1:f.p1, p2:f.p2, t1:f.t1, t2:f.t2 }))
      };
      store.put(s);
    }
  };
}

(async () => {
  await openDB();
  // キャッシュから読み込み、なければfetch→パース→キャッシュ
  let data = null;
  if (db && db.objectStoreNames.contains('dataCache')) {
    data = await new Promise(r => {
      const req = db.transaction('dataCache','readonly').objectStore('dataCache').get('bars1m');
      req.onsuccess = () => r(req.result?.data || null);
      req.onerror = () => r(null);
    });
  }
  if (!data) {
    const raw = await fetch('ohlc_1m.json.gz').then(r => new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json());
    data = [];
    for (let i = 0; i < raw.length; i += 5) {
      data.push({ t: raw[i], o: raw[i+1], h: raw[i+2], l: raw[i+3], c: raw[i+4] });
    }
    if (db && db.objectStoreNames.contains('dataCache')) {
      try { db.transaction('dataCache','readwrite').objectStore('dataCache').put({ id: 'bars1m', data }); } catch(e) {}
    }
  }
  bars1m = data;
    // 各取引日の開始位置を収集（日付が変わった最初のバー）
    const dayStarts = [];
    let lastDate = '';
    for (let i = 0; i < bars1m.length; i++) {
      const d = new Date(bars1m[i].t * 1000);
      const dateStr = d.toISOString().slice(0, 10);
      if (dateStr !== lastDate) {
        dayStarts.push(i);
        lastDate = dateStr;
      }
    }
    // 日足200MA用に過去約200営業日分さかのぼれるようにする
    const PAST_BARS = 220000;
    const candidates = dayStarts.filter(i => i >= PAST_BARS && i + 1440 < bars1m.length);
    // URLパラメータで復習モード対応
    const urlParams = new URLSearchParams(location.search);
    const reviewIdx = urlParams.get('startIdx');
    if (reviewIdx !== null) {
      curIdx1m = Math.min(parseInt(reviewIdx), bars1m.length - 1);
    } else if (candidates.length > 0) {
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      curIdx1m = pick;
    } else {
      curIdx1m = Math.min(PAST_BARS, bars1m.length - 1);
    }
    sessionStartIdx = curIdx1m;
    // セッション情報をDBに保存
    const startBar = bars1m[curIdx1m];
    const startDate = new Date(startBar.t * 1000).toISOString();
    dbPut('sessions', { id: sessionId, startIdx: curIdx1m, startDate, startPrice: startBar.c, playedAt: new Date().toISOString(), trades: 0, totalPnL: 0, memo: '' }).catch(() => {});

    // 復習モード: 前回の描画データを復元
    const reviewSession = urlParams.get('session');
    if (reviewSession && db) {
      try {
        // 描画データ復元
        const tx = db.transaction(['sessions', 'trades'], 'readonly');
        const sReq = tx.objectStore('sessions').get(parseInt(reviewSession));
        const tIdx = tx.objectStore('trades').index('sessionId');
        const tReq = tIdx.getAll(parseInt(reviewSession));
        let loaded = 0;
        function checkDone() { if (++loaded >= 2) renderBars(); }
        sReq.onsuccess = () => {
          const s = sReq.result;
          if (s && s.drawings) {
            fiboSaved = s.drawings.fibo || [];
            hlineSaved = s.drawings.hline || [];
            tlineSaved = s.drawings.tline || [];
          }
          checkDone();
        };
        tReq.onsuccess = () => {
          tradeHistory = tReq.result || [];
          checkDone();
        };
        sReq.onerror = () => checkDone();
        tReq.onerror = () => checkDone();
      } catch(e) { renderBars(); }
    } else {
      renderBars();
    }
})();

function toKLine(b) {
  return { timestamp: b.t * 1000, open: b.o, high: b.h, low: b.l, close: b.c, volume: 0 };
}

function renderBars() {
  // bars1m[0..curIdx1m] を現在TFで集計して表示
  const visible = aggregateBars(bars1m.slice(0, curIdx1m + 1), curTF).map(toKLine);
  chart.applyNewData(visible);
  const bar = bars1m[curIdx1m];
  document.getElementById('cur-time').textContent =
    new Date(bar.t * 1000).toLocaleString('ja-JP', { timeZone:'UTC', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  livePrice = bar.c;
  document.getElementById('cur-price').textContent = bar.c.toFixed(3);
  updatePnL(bar.c);
}

// ===== 時間足切り替え =====
document.getElementById('tf-select').addEventListener('change', e => {
  const tf = parseInt(e.target.value);
  if (tf === curTF) return;
  stopPlay(); playing = false; btnPlay.textContent = '▶︎';
  curTF = tf;
  renderBars();
});

// ===== 再生制御 =====
const btnPlay = document.getElementById('btn-play');
const speedEl = document.getElementById('speed');

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? '⏸︎' : '▶︎';
  if (playing) startPlay(); else stopPlay();
});

// ===== 擬似ティック生成（ブラウン橋 + ボラクラスタリング）=====
// 両端固定のランダムウォーク。H/Lを必ず通りながらOHLC辻褄を合わせる
function brownBridge(from, to, steps, volatility) {
  // ブラウン橋: 各ステップで「終点への誘導」+「ランダムノイズ」
  const pts = [from];
  let cur = from;
  // ボラティリティクラスター: 連続する動きの大きさを変化させる
  let vol = volatility;
  let momentum = 0;
  for (let i = 1; i <= steps; i++) {
    const remaining = steps - i + 1;
    const drift = (to - cur) / remaining;          // 終点へ引力
    vol = vol * (0.85 + Math.random() * 0.3);      // ボラのクラスタリング
    vol = Math.max(volatility * 0.3, Math.min(volatility * 2.5, vol));
    momentum = momentum * 0.6 + (Math.random() - 0.5) * vol; // モメンタム
    cur = cur + drift + momentum;
    pts.push(cur);
  }
  pts[pts.length - 1] = to;
  return pts;
}

function generateTicks(bar, numTicks) {
  const { o, h, l, c } = bar;
  const range = Math.max(h - l, 0.001);
  const vol   = range * 0.08; // 1ティックあたりのボラ基準

  // H/Lをどのタイミングで出すか乱数で決定
  const goHighFirst = Math.random() < 0.5;
  const ext1 = goHighFirst ? h : l;
  const ext2 = goHighFirst ? l : h;

  // 各セグメントにticksを配分（乱数でランダムな比率に）
  const r1 = 0.15 + Math.random() * 0.25;
  const r2 = 0.25 + Math.random() * 0.30;
  const n1  = Math.max(2, Math.round(numTicks * r1));
  const n2  = Math.max(2, Math.round(numTicks * r2));
  const n3  = Math.max(2, numTicks - n1 - n2);

  const seg1 = brownBridge(o,    ext1, n1, vol);
  const seg2 = brownBridge(ext1, ext2, n2, vol);
  const seg3 = brownBridge(ext2, c,    n3, vol);

  // 結合してH/L内にクランプ
  const raw = [...seg1, ...seg2.slice(1), ...seg3.slice(1)];
  const clamped = raw.map((p, i) =>
    i === 0 ? o : i === raw.length - 1 ? c : Math.max(l, Math.min(h, p))
  );

  // 低速時に「静止区間」をランダム挿入（同値を数回繰り返す）
  const spd = parseInt(speedEl.value);
  if (spd <= 4) {
    const result = [];
    for (let i = 0; i < clamped.length; i++) {
      result.push(clamped[i]);
      // 20〜40%の確率で同値を1〜4回追加（速度が遅いほど多く）
      if (Math.random() < 0.3) {
        const repeats = Math.floor(Math.random() * (5 - spd)) + 1;
        for (let r = 0; r < repeats; r++) result.push(clamped[i]);
      }
    }
    return result;
  }
  return clamped;
}

let tickQueue  = []; // 現在バーの擬似ティックキュー
let tickTimer  = null;
let livePrice  = 0;  // ティック再生中のリアルタイム価格

function flushTicks() { clearInterval(tickTimer); tickTimer = null; tickQueue = []; }

function startTickPlay(bar, onDone) {
  const spd    = parseInt(speedEl.value);
  const nTicks = Math.max(4, Math.round(20 - (spd - 1) * 1.8));
  const tickMs = Math.max(8, Math.round(getBarDelay(spd) / nTicks));
  tickQueue    = generateTicks(bar, nTicks);

  // 現在1m足より前のバーで確定している TFバーのベース（H/Lを先読みしない）
  const baseBar = (() => {
    if (curTF === 1) return { t: bar.t, o: bar.o, h: bar.o, l: bar.o, c: bar.o };
    const tfSec  = curTF * 60;
    const bucket = Math.floor(bar.t / tfSec) * tfSec;
    let b = { t: bucket, o: null, h: -Infinity, l: Infinity, c: bar.o };
    for (let j = curIdx1m - 1; j >= 0; j--) {
      if (Math.floor(bars1m[j].t / tfSec) * tfSec !== bucket) break;
      if (b.o === null) b.o = bars1m[j].o; // さらに左→上書き
      b.o = bars1m[j].o;
      if (bars1m[j].h > b.h) b.h = bars1m[j].h;
      if (bars1m[j].l < b.l) b.l = bars1m[j].l;
    }
    if (b.o === null) { b.o = bar.o; b.h = bar.o; b.l = bar.o; }
    return b;
  })();

  let tickH = baseBar.h, tickL = baseBar.l;
  let i = 0;
  tickTimer = setInterval(() => {
    if (i >= tickQueue.length) { flushTicks(); onDone(); return; }
    const price = tickQueue[i++];
    livePrice = price;
    if (price > tickH) tickH = price;
    if (price < tickL) tickL = price;
    const partial = { t: baseBar.t, o: baseBar.o, h: tickH, l: tickL, c: price };
    chart.updateData(toKLine(partial));
    document.getElementById('cur-price').textContent = price.toFixed(3);
    updatePnL(price);
  }, tickMs);
}

function getBarDelay(spd) {
  return [8000,5000,3000,1500,800,400,200,100,40,10][spd - 1];
}

function startPlay() {
  function tick() {
    if (curIdx1m + 1 >= bars1m.length - 1) { stopPlay(); playing = false; btnPlay.textContent = '▶︎'; return; }
    curIdx1m++;
    const bar = bars1m[curIdx1m];
    updateTimeLabel(bar);
    startTickPlay(bar, () => { if (playing) timer = setTimeout(tick, 0); });
  }
  timer = setTimeout(tick, 0);
}

function stopPlay() { clearTimeout(timer); timer = null; flushTicks(); }

speedEl.addEventListener('input', () => { if (playing) { stopPlay(); startPlay(); } });

function updateTimeLabel(bar) {
  document.getElementById('cur-time').textContent =
    new Date(bar.t * 1000).toLocaleString('ja-JP', { timeZone:'UTC', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function advance(n) {
  if (curIdx1m + n >= bars1m.length - 1) return false;
  flushTicks();
  curIdx1m += n;
  chart.updateData(toKLine(getPartialBar(curIdx1m)));
  const bar = bars1m[curIdx1m];
  updateTimeLabel(bar);
  document.getElementById('cur-price').textContent = bar.c.toFixed(3);
  updatePnL(bar.c);
  return true;
}

// ===== ポジション管理 =====
let positions   = [];
let posId       = 0;
let realizedPnL = 0; // 確定済み損益
let sessionStartIdx = 0; // セッション開始時のバーインデックス
let sessionId = Date.now(); // セッション識別子
let tradeHistory = []; // このセッションの全トレード履歴

// ===== IndexedDB =====
const HALF_SPREAD = 0.2; // 2pips = $0.20（片側）、合計4pips
function getLot() { return parseFloat(document.getElementById('lot').value); }

document.getElementById('btn-buy').addEventListener('click', () => {
  const mid = livePrice || bars1m[curIdx1m].c;
  const price = mid + HALF_SPREAD; // Askで約定
  const entryTime = new Date(bars1m[curIdx1m].t * 1000).toISOString();
  positions.push({ id: ++posId, type: 'BUY', price, lot: getLot(), entryTime, entryIdx: curIdx1m });
  updatePnL(mid);
});
document.getElementById('btn-sell').addEventListener('click', () => {
  const mid = livePrice || bars1m[curIdx1m].c;
  const price = mid - HALF_SPREAD; // Bidで約定
  const entryTime = new Date(bars1m[curIdx1m].t * 1000).toISOString();
  positions.push({ id: ++posId, type: 'SELL', price, lot: getLot(), entryTime, entryIdx: curIdx1m });
  updatePnL(mid);
});
document.getElementById('btn-close').addEventListener('click', () => {
  const mid = livePrice || bars1m[curIdx1m].c;
  const closeTime = new Date(bars1m[curIdx1m].t * 1000).toISOString();
  // 全ポジションを決済して確定損益に加算 + DB保存
  for (const p of positions) {
    const cur = p.type === 'BUY' ? mid - HALF_SPREAD : mid + HALF_SPREAD; // BUY→Bidで決済、SELL→Askで決済
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    const pnlUsd = diff * p.lot * 100;
    realizedPnL += pnlUsd;
    const trade = {
      sessionId, type: p.type, lot: p.lot,
      entryPrice: p.price, closePrice: cur,
      entryTime: p.entryTime, closeTime,
      entryIdx: p.entryIdx, closeIdx: curIdx1m,
      pnlUsd, pnlJpy: Math.round(pnlUsd * JPY_RATE),
      pips: Math.round(diff * 10) / 10,
      holdBars: curIdx1m - p.entryIdx
    };
    tradeHistory.push(trade);
    if (db) dbAdd('trades', trade);
  }
  // セッション情報を更新
  if (db) {
    const tx = db.transaction('sessions', 'readwrite');
    const store = tx.objectStore('sessions');
    const getReq = store.get(sessionId);
    getReq.onsuccess = () => {
      const existing = getReq.result || {};
      store.put({
        ...existing, id: sessionId, startIdx: sessionStartIdx,
        startDate: new Date(bars1m[sessionStartIdx].t * 1000).toISOString(),
        startPrice: bars1m[sessionStartIdx].c,
        trades: tradeHistory.length,
        totalPnL: realizedPnL,
        totalPnLJpy: Math.round(realizedPnL * JPY_RATE),
        drawings: {
          fibo: fiboSaved.map(f => ({ p1:f.p1, p2:f.p2, t1:f.t1, t2:f.t2 })),
          hline: hlineSaved.map(h => ({ price:h.price })),
          tline: tlineSaved.map(f => ({ p1:f.p1, p2:f.p2, t1:f.t1, t2:f.t2 }))
        }
      });
    };
  }
  positions = [];
  updatePnL(cur);
});

function calcFloat(mid) {
  let f = 0;
  for (const p of positions) {
    const cur = p.type === 'BUY' ? mid - HALF_SPREAD : mid + HALF_SPREAD;
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    f += diff * p.lot * 100;
  }
  return f;
}

const JPY_RATE = 160;
function fmtJpy(v) {
  const jpy = v * JPY_RATE;
  return `${jpy >= 0 ? '+' : ''}${Math.round(jpy).toLocaleString()}円`;
}
function fmtUsd(v) { return `${v >= 0 ? '+' : ''}${v.toFixed(2)}$`; }

function updatePnL(cur) {
  const floatPnL = calcFloat(cur);
  const totalPnL = realizedPnL + floatPnL;

  const fe = document.getElementById('pnl-float');
  fe.textContent = `含み: ${fmtJpy(floatPnL)}`;
  fe.style.color  = floatPnL >= 0 ? '#26a69a' : '#ef5350';

  const te = document.getElementById('pnl-total');
  te.textContent = `確定+含み: ${fmtJpy(totalPnL)}`;
  te.style.color  = totalPnL >= 0 ? '#26a69a' : '#ef5350';

  updatePosDisplay(cur);
}

function updatePosDisplay(cur) {
  const el = document.getElementById('positions');
  const info = document.getElementById('pos-info');
  if (positions.length === 0) {
    el.innerHTML = `<span style="color:#666">ポジションなし</span>　<span style="color:#aaa">確定: ${fmtJpy(realizedPnL)}</span>`;
    info.textContent = '';
    return;
  }
  el.innerHTML = positions.map(p => {
    const diff = p.type === 'BUY' ? cur - p.price : p.price - cur;
    const pnl  = diff * p.lot * 100;
    return `<span style="color:${pnl>=0?'#26a69a':'#ef5350'}">[${p.id}] ${p.type} ${p.lot} @ ${p.price.toFixed(2)} → ${fmtJpy(pnl)}</span>`;
  }).join('  ') + `　<span style="color:#aaa;font-size:11px">確定累計: ${fmtJpy(realizedPnL)}</span>`;
  info.textContent = `${positions.length}件`;
}

// ===== フィボナッチ（Canvasドラッグ方式）=====
const FIBO_LEVELS  = [0, 1.0, 1.236, 1.382, 1.618, 1.764, 2.0, 2.618];

// Canvas オーバーレイを chart div の上に重ねる
const chartDiv = document.getElementById('chart');
const fiboCanvas = document.createElement('canvas');
Object.assign(fiboCanvas.style, {
  position: 'absolute', top: '0', left: '0',
  pointerEvents: 'none', zIndex: '10', touchAction: 'none'
});
chartDiv.style.position = 'relative';
chartDiv.appendChild(fiboCanvas);
const ctx = fiboCanvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  fiboCanvas.width  = chartDiv.clientWidth  * dpr;
  fiboCanvas.height = chartDiv.clientHeight * dpr;
  fiboCanvas.style.width  = chartDiv.clientWidth  + 'px';
  fiboCanvas.style.height = chartDiv.clientHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawFibo();
}
new ResizeObserver(resizeCanvas).observe(chartDiv);

// 保存済み描画オブジェクト
let fiboSaved  = []; // { p1, p2, t1, t2 }
let hlineSaved = []; // { price }
let tlineSaved = []; // { p1, p2, t1, t2 }
let fiboDrag   = null;
let tlineDrag  = null;
let curTool    = ''; // 'fibo' | 'hline' | 'tline' | ''
let editMode   = false; // 編集モード
let editTarget = null;  // { type, idx } 編集対象（nullなら全表示）

// 価格 → Y座標（KLineChart convertToPixel API）
function priceToY(price) {
  try {
    const r = chart.convertToPixel({ value: price }, { paneId: 'candle_pane', absolute: true });
    return r ? r.y : null;
  } catch(e) { return null; }
}

// タイムスタンプ → ピクセルX（範囲外は中央2点から外挿）
function timeToX(ts) {
  try {
    const r = chart.convertToPixel({ timestamp: ts }, { paneId: 'candle_pane', absolute: true });
    if (r?.x !== undefined && r.x !== null) return r.x;
    // 範囲外（未来等）→ 中央2点でpx/msを求めて外挿
    const cx = fiboCanvas.width;
    const ra = chart.convertFromPixel({ x: cx * 0.3, y: 100 }, { paneId: 'candle_pane', absolute: true });
    const rb = chart.convertFromPixel({ x: cx * 0.7, y: 100 }, { paneId: 'candle_pane', absolute: true });
    if (ra?.timestamp && rb?.timestamp) {
      const pxPerMs = (cx * 0.4) / (rb.timestamp - ra.timestamp);
      return cx * 0.7 + (ts - rb.timestamp) * pxPerMs;
    }
    return null;
  } catch(e) { return null; }
}

// 中央2点でms/pxを計算するヘルパー
function getMsPerPx() {
  const cx = fiboCanvas.width;
  const ra = chart.convertFromPixel({ x: cx * 0.3, y: 100 }, { paneId: 'candle_pane', absolute: true });
  const rb = chart.convertFromPixel({ x: cx * 0.7, y: 100 }, { paneId: 'candle_pane', absolute: true });
  if (ra?.timestamp && rb?.timestamp && rb.timestamp !== ra.timestamp) {
    return { msPerPx: (rb.timestamp - ra.timestamp) / (cx * 0.4), refX: cx * 0.7, refTs: rb.timestamp };
  }
  return null;
}

// ピクセル → タイムスタンプ
// convertFromPixelは最終バー以降をクランプするので、最終バーのX以降は外挿
function xToTime(x) {
  try {
    const lastTs = bars1m[curIdx1m]?.t * 1000;
    const lastPx = lastTs ? chart.convertToPixel({ timestamp: lastTs }, { paneId: 'candle_pane', absolute: true })?.x : null;

    if (lastPx !== null && lastPx !== undefined && x > lastPx + 2) {
      // 最終バーより右 → 外挿
      const ref = getMsPerPx();
      if (ref) return ref.refTs + (x - ref.refX) * ref.msPerPx;
      return lastTs + (x - lastPx) * (curTF * 60 * 1000); // 粗いフォールバック
    }
    const r = chart.convertFromPixel({ x, y: 100 }, { paneId: 'candle_pane', absolute: true });
    return (r?.timestamp) ? r.timestamp : null;
  } catch(e) { return null; }
}

// タイムスタンプ → ピクセルX
// 最終バー以降のtsはconvertToPixelがnullを返すので外挿
function timeToX(ts) {
  try {
    const lastTs = bars1m[curIdx1m]?.t * 1000;
    if (lastTs && ts > lastTs + curTF * 60 * 1000) {
      // 未来のts → 外挿
      const ref = getMsPerPx();
      if (ref) return ref.refX + (ts - ref.refTs) / ref.msPerPx;
      const lastPx = chart.convertToPixel({ timestamp: lastTs }, { paneId: 'candle_pane', absolute: true })?.x;
      if (lastPx !== null) return lastPx + (ts - lastTs) / (curTF * 60 * 1000);
      return null;
    }
    const r = chart.convertToPixel({ timestamp: ts }, { paneId: 'candle_pane', absolute: true });
    return (r?.x !== undefined && r.x !== null) ? r.x : null;
  } catch(e) { return null; }
}

// rawX1/rawX2: ドラッグ中の生ピクセル（指定時はtsよりも優先）
function drawOneFibo(p1, p2, t1, t2, alpha = 1.0, rawX1 = null, rawX2 = null) {
  const range  = Math.abs(p1 - p2);
  const isDown = p1 >= p2;

  const xa = timeToX(t1) ?? rawX1;
  const xb = timeToX(t2) ?? rawX2;
  const xL = Math.min(xa ?? 0,              xb ?? fiboCanvas.width);
  const xR = Math.max(xa ?? 0,              xb ?? fiboCanvas.width);

  FIBO_LEVELS.forEach((lvl, i) => {
    // 100% = p1（ドラッグ開始点）、0% = p2、以降は同方向に延伸
    const price = isDown ? (p2 + range * lvl) : (p2 - range * lvl);
    const y = priceToY(price);
    if (y === null || y < 0 || y > fiboCanvas.height) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(xL, y);
    ctx.lineTo(xR, y);
    ctx.stroke();

    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle   = '#ffffff';
    ctx.font        = '11px monospace';
    const labelY = isDown ? y - 3 : y + 12;
    const labelText = lvl === 0 ? '' : `${lvl}`;
    ctx.fillText(labelText, Math.min(xR + 4, fiboCanvas.width - 115), labelY);
    ctx.restore();
  });
}

const HANDLE_R = 6; // ハンドル半径(px)


// 決済済みトレードのエントリー・決済マーカーを描画
// ===== FVG（Fair Value Gap）=====
let fvgEnabled = JSON.parse(localStorage.getItem('fvgEnabled') || 'false');
let fvgCache = []; // { top, bottom, startTs, bullish }
let fvgCacheIdx = -1;

function detectFVGs() {
  if (fvgCacheIdx === curIdx1m) return;
  fvgCacheIdx = curIdx1m;
  fvgCache = [];
  if (!fvgEnabled) return;

  const tfBars = aggregateBars(bars1m.slice(0, curIdx1m + 1), curTF);

  // 最小ギャップサイズ: 直近50本のATR的な平均レンジの30%
  const recentBars = tfBars.slice(-50);
  const avgRange = recentBars.reduce((s, b) => s + (b.h - b.l), 0) / recentBars.length;
  const minGap = avgRange * 0.3;

  const lastPrice = tfBars[tfBars.length - 1]?.c || 0;

  for (let i = 2; i < tfBars.length; i++) {
    const prev = tfBars[i - 2];
    const curr = tfBars[i - 1];
    const next = tfBars[i];

    let top, bottom, bullish;
    // Bullish FVG
    if (prev.h < next.l) {
      top = next.l; bottom = prev.h; bullish = true;
    }
    // Bearish FVG
    else if (prev.l > next.h) {
      top = prev.l; bottom = next.h; bullish = false;
    }
    else continue;

    const gap = top - bottom;
    // フィルタ: 小さいギャップを除外
    if (gap < minGap) continue;

    // 埋められたFVGを除外（その後の価格がゾーンを完全に通過）
    let mitigated = false;
    for (let j = i + 1; j < tfBars.length; j++) {
      if (bullish && tfBars[j].l <= bottom) { mitigated = true; break; }
      if (!bullish && tfBars[j].h >= top) { mitigated = true; break; }
    }
    if (mitigated) continue;

    fvgCache.push({
      top, bottom,
      startTs: curr.t * 1000,
      endTs: next.t * 1000,
      bullish
    });
  }
  // 直近50個に制限
  if (fvgCache.length > 50) fvgCache = fvgCache.slice(-50);
}

function drawFVGs() {
  if (!fvgEnabled || fvgCache.length === 0) return;
  const w = chartDiv.clientWidth;
  fvgCache.forEach(fvg => {
    const x1 = timeToX(fvg.startTs);
    const yTop = priceToY(fvg.top);
    const yBot = priceToY(fvg.bottom);
    if (x1 === null || yTop === null || yBot === null) return;
    if (yTop > chartDiv.clientHeight || yBot < 0) return;

    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = fvg.bullish ? '#26a69a' : '#ef5350';
    ctx.fillRect(x1, yTop, w - x1, yBot - yTop);
    // 上下の境界線のみ
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = fvg.bullish ? '#26a69a' : '#ef5350';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(x1, yTop); ctx.lineTo(w, yTop);
    ctx.moveTo(x1, yBot); ctx.lineTo(w, yBot);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
}

// Bid/Ask価格ラベル（Y軸右側のみ）
function drawBidAskLines() {
  const mid = livePrice || bars1m[curIdx1m]?.c || 0;
  if (mid === 0) return;
  const bid = mid - HALF_SPREAD;
  const ask = mid + HALF_SPREAD;
  const w = chartDiv.clientWidth;

  const bidY = priceToY(bid);
  const askY = priceToY(ask);

  [{ price: bid, color: '#ef5350', y: bidY },
   { price: ask, color: '#26a69a', y: askY }].forEach(({ price, color, y }) => {
    if (y === null || y < 0 || y > chartDiv.clientHeight) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    ctx.restore();
  });

  // ラベル（重ならないよう調整）
  if (bidY !== null && askY !== null) {
    ctx.save();
    ctx.font = 'bold 10px monospace';
    const lblH = 12;
    let by = bidY, ay = askY;
    // 近すぎる場合は上下にずらす
    if (Math.abs(by - ay) < lblH + 2) {
      const mid2 = (by + ay) / 2;
      ay = mid2 - lblH / 2 - 1;
      by = mid2 + lblH / 2 + 1;
    }
    [{ price: bid, color: '#ef5350', y: by },
     { price: ask, color: '#26a69a', y: ay }].forEach(({ price, color, y }) => {
      const label = price.toFixed(2);
      const tw = ctx.measureText(label).width;
      const lx = w - tw - 4;
      ctx.fillStyle = color;
      ctx.fillRect(lx - 2, y - 6, tw + 4, lblH);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, lx, y + 3);
    });
    ctx.restore();
  }
}

function drawTradeMarkers() {
  if (tradeHistory.length === 0) return;
  tradeHistory.forEach(t => {
    const entryX = timeToX(t.entryTime ? new Date(t.entryTime).getTime() : null);
    const closeX = timeToX(t.closeTime ? new Date(t.closeTime).getTime() : null);
    const entryY = priceToY(t.entryPrice);
    const closeY = priceToY(t.closePrice);
    const isBuy = t.type === 'BUY';
    const profit = t.pnlUsd >= 0;

    // エントリー→決済の接続線
    if (entryX !== null && closeX !== null && entryY !== null && closeY !== null) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = profit ? '#26a69a' : '#ef5350';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(entryX, entryY);
      ctx.lineTo(closeX, closeY);
      ctx.stroke();
      ctx.restore();
    }

    // エントリーマーカー（▲/▼）
    if (entryX !== null && entryY !== null) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = isBuy ? '#1565c0' : '#b71c1c';
      ctx.beginPath();
      if (isBuy) {
        ctx.moveTo(entryX, entryY + 6);
        ctx.lineTo(entryX - 5, entryY + 14);
        ctx.lineTo(entryX + 5, entryY + 14);
      } else {
        ctx.moveTo(entryX, entryY - 6);
        ctx.lineTo(entryX - 5, entryY - 14);
        ctx.lineTo(entryX + 5, entryY - 14);
      }
      ctx.fill();
      ctx.restore();
    }

    // 決済マーカー（×）
    if (closeX !== null && closeY !== null) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = profit ? '#26a69a' : '#ef5350';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(closeX - 5, closeY - 5);
      ctx.lineTo(closeX + 5, closeY + 5);
      ctx.moveTo(closeX + 5, closeY - 5);
      ctx.lineTo(closeX - 5, closeY + 5);
      ctx.stroke();
      // 損益ラベル
      ctx.font = 'bold 10px monospace';
      ctx.fillStyle = profit ? '#26a69a' : '#ef5350';
      ctx.fillText(fmtJpy(t.pnlUsd), closeX + 8, closeY + 4);
      ctx.restore();
    }
  });
}

function drawPositionLines() {
  if (positions.length === 0) return;
  const cur = livePrice || bars1m[curIdx1m]?.c || 0;
  positions.forEach(p => {
    const y = priceToY(p.price);
    if (y === null || y < 0 || y > fiboCanvas.height) return;
    const isBuy = p.type === 'BUY';
    const diff  = isBuy ? cur - p.price : p.price - cur;
    const profit = diff >= 0;
    ctx.save();
    ctx.strokeStyle = isBuy ? '#42a5f5' : '#ef5350';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(fiboCanvas.width, y);
    ctx.stroke();
    // ラベル
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.9;
    ctx.font = 'bold 11px monospace';
    const pnl  = diff * p.lot * 100;
    const label = `${p.type}  ${fmtJpy(pnl)}`;
    ctx.font = 'bold 12px monospace';
    const tw = ctx.measureText(label).width;
    const lx = (chartDiv.clientWidth - tw) / 2 - 4;
    ctx.fillStyle = profit ? '#1b5e20cc' : '#b71c1ccc';
    ctx.fillRect(lx, y - 15, tw + 8, 16);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, lx + 4, y - 3);
    ctx.restore();
  });
}

function drawOneHLine(price, alpha = 1.0) {
  const y = priceToY(price);
  const w = chartDiv.clientWidth;
  if (y === null || y < 0 || y > chartDiv.clientHeight) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ffeb3b';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(w, y);
  ctx.stroke();
  // Y軸上に価格ラベル
  ctx.font = 'bold 10px monospace';
  const label = price.toFixed(2);
  const tw = ctx.measureText(label).width;
  const lx = w - tw - 4;
  ctx.fillStyle = '#ffeb3bcc';
  ctx.fillRect(lx - 2, y - 6, tw + 4, 12);
  ctx.fillStyle = '#000';
  ctx.fillText(label, lx, y + 3);
  ctx.restore();
}

function drawOneTLine(p1, p2, t1, t2, alpha = 1.0, rx1 = null, rx2 = null) {
  const x1 = timeToX(t1) ?? rx1, x2 = timeToX(t2) ?? rx2;
  const y1 = priceToY(p1), y2 = priceToY(p2);
  if (x1 === null || x2 === null || y1 === null || y2 === null) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawAllHandles() {
  if (!editMode) return;
  function shouldDraw(type, idx) {
    if (!editTarget) return true;
    return editTarget.type === type && editTarget.idx === idx;
  }
  function drawPairHandles(collection, type, color) {
    collection.forEach((f, i) => {
      if (!shouldDraw(type, i)) return;
      [['p1','t1'], ['p2','t2']].forEach(([pk, tk]) => {
        const x = timeToX(f[tk]), y = priceToY(f[pk]);
        if (x === null || y === null) return;
        ctx.beginPath(); ctx.arc(x, y, HANDLE_R, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    });
  }
  drawPairHandles(fiboSaved, 'fibo', '#f57f17');
  drawPairHandles(tlineSaved, 'tline', '#ffffff');
  // トレンドライン中央移動ハンドル
  tlineSaved.forEach((f, i) => {
    if (!shouldDraw('tline', i)) return;
    const x1 = timeToX(f.t1), x2 = timeToX(f.t2);
    const y1 = priceToY(f.p1), y2 = priceToY(f.p2);
    if (x1 === null || x2 === null || y1 === null || y2 === null) return;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    ctx.beginPath(); ctx.arc(mx, my, HANDLE_R, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.5; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 1; ctx.stroke();
  });
  // 水平線ハンドル（中央）
  hlineSaved.forEach((h, i) => {
    if (!shouldDraw('hline', i)) return;
    const y = priceToY(h.price);
    if (y === null) return;
    const cx = chartDiv.clientWidth / 2;
    ctx.beginPath(); ctx.arc(cx, y, HANDLE_R, 0, Math.PI*2);
    ctx.fillStyle = '#ffeb3b'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

let _drawingsDirty = false;
let _saveTimer = null;
function markDrawingsDirty() {
  if (_drawingsDirty) return;
  _drawingsDirty = true;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => { _drawingsDirty = false; saveDrawings(); }, 1000);
}

function redrawFibo() {
  ctx.clearRect(0, 0, fiboCanvas.width, fiboCanvas.height);
  detectFVGs();
  drawFVGs();
  drawBidAskLines();
  drawTradeMarkers();
  drawPositionLines();
  hlineSaved.forEach(h => drawOneHLine(h.price));
  tlineSaved.forEach(f => drawOneTLine(f.p1, f.p2, f.t1, f.t2));
  fiboSaved.forEach(f => drawOneFibo(f.p1, f.p2, f.t1, f.t2, 1.0, null, f.rx2));
  if (fiboDrag) drawOneFibo(fiboDrag.p1, fiboDrag.p2, fiboDrag.t1, fiboDrag.t2, 0.6, fiboDrag.rx1, fiboDrag.rx2);
  if (tlineDrag) drawOneTLine(tlineDrag.p1, tlineDrag.p2, tlineDrag.t1, tlineDrag.t2, 0.6, tlineDrag.rx1, tlineDrag.rx2);
  drawAllHandles();
}

// 50ms間隔で再描画（スクロール・ズーム・スケール変更に追随）
setInterval(redrawFibo, 50);
// イベントでも即時反映
chart.subscribeAction(klinecharts.ActionType.OnVisibleRangeChange, redrawFibo);

// ===== ドラッグ操作 =====
let fiboActive     = false;
let dragging       = false;
let dragStartPrice = null;
let editHandle     = null; // { fiboIdx, point:'p1'|'p2' } ハンドル編集中

// ハンドルのヒットテスト（editTarget限定）
function hitHandle(mx, my) {
  if (editTarget) {
    const col = editTarget.type === 'hline' ? hlineSaved : editTarget.type === 'tline' ? tlineSaved : fiboSaved;
    const f = col[editTarget.idx];
    if (!f) return null;
    if (editTarget.type === 'hline') {
      const y = priceToY(f.price), cx = chartDiv.clientWidth / 2;
      if (y !== null && Math.sqrt((mx-cx)**2 + (my-y)**2) < HANDLE_R + 6)
        return { collection: col, idx: editTarget.idx, point: 'price', timeKey: null, type: 'hline' };
    } else {
      // 中央ハンドル（全体移動）
      if (editTarget.type === 'tline') {
        const x1 = timeToX(f.t1), x2 = timeToX(f.t2), y1 = priceToY(f.p1), y2 = priceToY(f.p2);
        if (x1 !== null && x2 !== null && y1 !== null && y2 !== null) {
          const cmx = (x1+x2)/2, cmy = (y1+y2)/2;
          if (Math.sqrt((mx-cmx)**2 + (my-cmy)**2) < HANDLE_R + 6)
            return { collection: col, idx: editTarget.idx, point: 'move', timeKey: null, type: 'tline_move' };
        }
      }
      for (const [pk, tk] of [['p1','t1'], ['p2','t2']]) {
        const x = timeToX(f[tk]), y = priceToY(f[pk]);
        if (x === null || y === null) continue;
        if (Math.sqrt((mx-x)**2 + (my-y)**2) < HANDLE_R + 6)
          return { collection: col, idx: editTarget.idx, point: pk, timeKey: tk, type: editTarget.type };
      }
    }
    return null;
  }
  // フィボ
  for (let i = fiboSaved.length - 1; i >= 0; i--) {
    const f = fiboSaved[i];
    for (const [pk, tk] of [['p1','t1'], ['p2','t2']]) {
      const x = timeToX(f[tk]), y = priceToY(f[pk]);
      if (x === null || y === null) continue;
      if (Math.sqrt((mx-x)**2 + (my-y)**2) < HANDLE_R + 6)
        return { collection: fiboSaved, idx: i, point: pk, timeKey: tk, type: 'fibo' };
    }
  }
  // トレンドライン
  for (let i = tlineSaved.length - 1; i >= 0; i--) {
    const f = tlineSaved[i];
    for (const [pk, tk] of [['p1','t1'], ['p2','t2']]) {
      const x = timeToX(f[tk]), y = priceToY(f[pk]);
      if (x === null || y === null) continue;
      if (Math.sqrt((mx-x)**2 + (my-y)**2) < HANDLE_R + 6)
        return { collection: tlineSaved, idx: i, point: pk, timeKey: tk, type: 'tline' };
    }
  }
  // 水平線（中央ハンドル）
  for (let i = hlineSaved.length - 1; i >= 0; i--) {
    const y = priceToY(hlineSaved[i].price);
    const cx = chartDiv.clientWidth / 2;
    if (y !== null && Math.sqrt((mx-cx)**2 + (my-y)**2) < HANDLE_R + 6)
      return { collection: hlineSaved, idx: i, point: 'price', timeKey: null, type: 'hline' };
  }
  return null;
}

const toolBtns = document.querySelectorAll('.tool-btn');

function enableFiboMode(tool) {
  curTool = tool || curTool;
  fiboActive = true;
  fiboCanvas.style.pointerEvents = 'auto';
  fiboCanvas.style.cursor = 'crosshair';
  toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === curTool));
  chart.setScrollEnabled(false);
  chart.setZoomEnabled(false);
  redrawFibo();
}
function disableFiboMode() {
  fiboActive = false; dragging = false; fiboDrag = null; tlineDrag = null; editHandle = null;
  curTool = ''; editMode = false; editTarget = null;
  fiboCanvas.style.pointerEvents = 'none';
  fiboCanvas.style.cursor = 'default';
  toolBtns.forEach(b => b.classList.remove('active'));
  chart.setScrollEnabled(true);
  chart.setZoomEnabled(true);
  redrawFibo();
}

toolBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.tool;
    if (fiboActive && curTool === v) { disableFiboMode(); }
    else { editMode = false; enableFiboMode(v); }
  });
});

function pixelToPrice(y) {
  try {
    const r = chart.convertFromPixel({ x: 100, y }, { paneId: 'candle_pane', absolute: true });
    return (r && r.value !== undefined) ? r.value : null;
  } catch(e) { return null; }
}

let dragStartTime = null;
let dragStartX    = null;

fiboCanvas.addEventListener('mousedown', e => {
  if (!fiboActive) return;
  const hit = hitHandle(e.offsetX, e.offsetY);
  if (hit) {
    editHandle = hit;
    if (hit.type === 'tline_move') {
      const f = hit.collection[hit.idx];
      editHandle._startP1 = f.p1; editHandle._startP2 = f.p2;
      editHandle._startT1 = f.t1; editHandle._startT2 = f.t2;
      editHandle._startPrice = pixelToPrice(e.offsetY);
      editHandle._startTime = xToTime(e.offsetX);
    }
    fiboCanvas.style.cursor = 'grab';
  } else if (editMode) {
    // 編集モードでハンドル外クリック → 終了
    disableFiboMode();
  } else if (curTool === 'hline') {
    const p = pixelToPrice(e.offsetY);
    if (p !== null) {
      hlineSaved.push({ price: p }); markDrawingsDirty();
      editMode = true; editTarget = { type: 'hline', idx: hlineSaved.length - 1 };
      curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      redrawFibo();
    }
  } else if (curTool === 'fibo' || curTool === 'tline') {
    const p = pixelToPrice(e.offsetY);
    const t = xToTime(e.offsetX);
    if (p !== null && t !== null) { dragStartPrice = p; dragStartTime = t; dragStartX = e.offsetX; dragging = true; }
  }
});

// ドラッグ中はキャンバス外でも追従（document レベル）
function canvasRelPos(e) {
  const rect = fiboCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

document.addEventListener('mousemove', e => {
  if (!fiboActive) return;
  const { x, y } = canvasRelPos(e);

  if (editHandle) {
    const p = pixelToPrice(y), t = xToTime(x);
    if (p !== null) {
      if (editHandle.type === 'tline_move') {
        const dp = p - editHandle._startPrice;
        const dt = t !== null && editHandle._startTime !== null ? t - editHandle._startTime : 0;
        const f = editHandle.collection[editHandle.idx];
        f.p1 = editHandle._startP1 + dp;
        f.p2 = editHandle._startP2 + dp;
        f.t1 = editHandle._startT1 + dt;
        f.t2 = editHandle._startT2 + dt;
      } else if (editHandle.type === 'hline') {
        editHandle.collection[editHandle.idx].price = p;
      } else {
        editHandle.collection[editHandle.idx][editHandle.point] = p;
        if (t !== null && editHandle.timeKey) editHandle.collection[editHandle.idx][editHandle.timeKey] = t;
      }
      redrawFibo();
    }
  } else if (dragging && dragStartPrice !== null) {
    const p = pixelToPrice(y) ?? dragStartPrice;
    const t = xToTime(x)     ?? dragStartTime;
    if (curTool === 'tline') {
      tlineDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t, rx1: dragStartX, rx2: x };
    } else {
      fiboDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t, rx1: dragStartX, rx2: x };
    }
    redrawFibo();
  } else if (e.target === fiboCanvas) {
    const hit = hitHandle(x, y);
    fiboCanvas.style.cursor = hit ? 'grab' : 'crosshair';
  }
});

document.addEventListener('mouseup', e => {
  if (!fiboActive) return;
  const { x, y } = canvasRelPos(e);

  if (editHandle) {
    editHandle = null;
    fiboCanvas.style.cursor = 'crosshair';
    markDrawingsDirty(); redrawFibo();
  } else if (dragging) {
    if (curTool === 'tline') {
      if (tlineDrag && Math.abs(tlineDrag.p2 - tlineDrag.p1) > 0.001) {
        tlineSaved.push({ p1: tlineDrag.p1, p2: tlineDrag.p2, t1: tlineDrag.t1, t2: tlineDrag.t2 }); markDrawingsDirty();
        editMode = true; editTarget = { type: 'tline', idx: tlineSaved.length - 1 };
        curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      } else { disableFiboMode(); }
      tlineDrag = null;
    } else if (curTool === 'fibo') {
      if (fiboDrag && Math.abs(fiboDrag.p2 - fiboDrag.p1) > 0.001) {
        fiboSaved.push({ p1: fiboDrag.p1, p2: fiboDrag.p2, t1: fiboDrag.t1, t2: fiboDrag.t2, rx1: fiboDrag.rx1, rx2: fiboDrag.rx2 }); markDrawingsDirty();
        editMode = true; editTarget = { type: 'fibo', idx: fiboSaved.length - 1 };
        curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      } else { disableFiboMode(); }
      fiboDrag = null;
    } else { disableFiboMode(); }
    dragging = false; dragStartPrice = null; dragStartTime = null; dragStartX = null;
    redrawFibo();
  }
});

document.getElementById('btn-tool-clear').addEventListener('click', () => {
  fiboSaved = []; hlineSaved = []; tlineSaved = [];
  disableFiboMode();
});

// ===== 描画オブジェクトのヒットテスト（ライン近傍10px） =====
// 返り値: { type, idx } or null
function hitDrawObject(mx, my) {
  // 水平線
  for (let i = hlineSaved.length - 1; i >= 0; i--) {
    const y = priceToY(hlineSaved[i].price);
    if (y !== null && Math.abs(my - y) < 10) return { type: 'hline', idx: i };
  }
  // トレンドライン
  for (let i = tlineSaved.length - 1; i >= 0; i--) {
    const f = tlineSaved[i];
    const x1 = timeToX(f.t1), x2 = timeToX(f.t2);
    const y1 = priceToY(f.p1), y2 = priceToY(f.p2);
    if (x1 === null || x2 === null || y1 === null || y2 === null) continue;
    // 点と線分の距離
    const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
    const t = len2 > 0 ? Math.max(0, Math.min(1, ((mx-x1)*dx+(my-y1)*dy)/len2)) : 0;
    const px = x1+t*dx, py = y1+t*dy;
    if (Math.sqrt((mx-px)**2+(my-py)**2) < 10) return { type: 'tline', idx: i };
  }
  // フィボ
  for (let i = fiboSaved.length - 1; i >= 0; i--) {
    const f = fiboSaved[i];
    const xa = timeToX(f.t1), xb = timeToX(f.t2);
    if (xa === null || xb === null) continue;
    const xL = Math.min(xa, xb), xR = Math.max(xa, xb);
    if (mx < xL - 10 || mx > xR + 60) continue;
    const range = Math.abs(f.p1 - f.p2);
    const isDown = f.p1 >= f.p2;
    for (const lvl of FIBO_LEVELS) {
      const price = isDown ? (f.p2 + range * lvl) : (f.p2 - range * lvl);
      const y = priceToY(price);
      if (y !== null && Math.abs(my - y) < 10) return { type: 'fibo', idx: i };
    }
  }
  return null;
}
// 後方互換
function hitFiboObject(mx, my) {
  const hit = hitDrawObject(mx, my);
  return hit ? hit.idx : -1;
}

Object.assign(deleteMenu.style, {

});

const menuItemHover = 'this.style.background="#3d6a99"';

let deleteTargetIdx = -1;
let deleteTargetType = '';
function showDeleteMenu(x, y, idx, type) {
  deleteTargetIdx = idx;
  deleteTargetType = type || '';
  deleteMenu.style.display = 'block';
  const mh = deleteMenu.offsetHeight;
  const mw = deleteMenu.offsetWidth;
  deleteMenu.style.left = Math.min(x, window.innerWidth  - mw - 4) + 'px';
  deleteMenu.style.top  = Math.max(4, y - mh - 4) + 'px';
  deleteMenu.style.display = 'block';
}
function hideDeleteMenu() { deleteMenu.style.display = 'none'; deleteTargetIdx = -1; deleteTargetType = ''; }

document.getElementById('dmenu-edit').addEventListener('click', () => {
  if (deleteTargetIdx >= 0) {
    editMode = true;
    editTarget = { type: deleteTargetType, idx: deleteTargetIdx };
    enableFiboMode(deleteTargetType || 'fibo');
  }
  hideDeleteMenu();
});
document.getElementById('dmenu-dup').addEventListener('click', () => {
  if (deleteTargetIdx >= 0) {
    const col = deleteTargetType === 'hline' ? hlineSaved : deleteTargetType === 'tline' ? tlineSaved : fiboSaved;
    const orig = col[deleteTargetIdx];
    if (orig) {
      // 少しずらして複製（トレンドラインは同じ傾きで価格を少しずらす）
      const offset = deleteTargetType === 'hline' ? 5 : 3;
      const dup = JSON.parse(JSON.stringify(orig));
      if (deleteTargetType === 'hline') {
        dup.price += offset;
      } else {
        dup.p1 += offset; dup.p2 += offset;
      }
      col.push(dup);
      editMode = true; editTarget = { type: deleteTargetType, idx: col.length - 1 };
      enableFiboMode(deleteTargetType);
      markDrawingsDirty(); redrawFibo();
    }
  }
  hideDeleteMenu();
});
document.getElementById('dmenu-del').addEventListener('click', () => {
  if (deleteTargetIdx >= 0) {
    const col = deleteTargetType === 'hline' ? hlineSaved : deleteTargetType === 'tline' ? tlineSaved : fiboSaved;
    col.splice(deleteTargetIdx, 1);
    markDrawingsDirty(); redrawFibo();
  }
  hideDeleteMenu();
});
document.addEventListener('touchstart', e => {
  if (!deleteMenu.contains(e.target)) hideDeleteMenu();
}, { passive: true });
document.addEventListener('mousedown', e => {
  if (!deleteMenu.contains(e.target)) hideDeleteMenu();
});

// ===== タッチ操作（スマホ対応）=====
let longPressTimer = null;
let touchMoved     = false;
let touchDragging  = false;

function getTouchPos(e) {
  const t = e.touches[0];
  const rect = fiboCanvas.getBoundingClientRect();
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

// fiboCanvas にもタッチ受付（FIBOモード時）
fiboCanvas.addEventListener('touchstart', e => {
  if (!fiboActive) return;
  e.preventDefault();
  touchMoved = false;
  const { x, y } = getTouchPos(e);

  // 長押し検出（FIBOモード外でも動作させたいので後で別途追加）
  longPressTimer = setTimeout(() => {
    if (!touchMoved) {
      const hit = hitDrawObject(x, y);
      if (hit) {
        const t = e.touches[0];
        showDeleteMenu(t.clientX, t.clientY - 60, hit.idx, hit.type);
        dragging = false; dragStartPrice = null; dragStartTime = null; fiboDrag = null; tlineDrag = null;
      }
    }
  }, 500);

  const hit = hitHandle(x, y);
  if (hit) {
    editHandle = hit;
    if (hit.type === 'tline_move') {
      const f = hit.collection[hit.idx];
      editHandle._startP1 = f.p1; editHandle._startP2 = f.p2;
      editHandle._startT1 = f.t1; editHandle._startT2 = f.t2;
      editHandle._startPrice = pixelToPrice(y);
      editHandle._startTime = xToTime(x);
    }
  } else if (editMode) {
    disableFiboMode();
  } else if (curTool === 'hline') {
    const p = pixelToPrice(y);
    if (p !== null) {
      hlineSaved.push({ price: p }); markDrawingsDirty();
      editMode = true; editTarget = { type: 'hline', idx: hlineSaved.length - 1 };
      curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      redrawFibo();
    }
  } else if (curTool === 'fibo' || curTool === 'tline') {
    const p = pixelToPrice(y), t = xToTime(x);
    if (p !== null && t !== null) { dragStartPrice = p; dragStartTime = t; touchDragging = true; }
  }
}, { passive: false });

fiboCanvas.addEventListener('touchmove', e => {
  if (!fiboActive) return;
  e.preventDefault();
  touchMoved = true;
  clearTimeout(longPressTimer);
  const { x, y } = getTouchPos(e);

  if (editHandle) {
    const p = pixelToPrice(y), t = xToTime(x);
    if (p !== null) {
      if (editHandle.type === 'tline_move') {
        const dp = p - editHandle._startPrice;
        const dt = t !== null && editHandle._startTime !== null ? t - editHandle._startTime : 0;
        const f = editHandle.collection[editHandle.idx];
        f.p1 = editHandle._startP1 + dp;
        f.p2 = editHandle._startP2 + dp;
        f.t1 = editHandle._startT1 + dt;
        f.t2 = editHandle._startT2 + dt;
      } else if (editHandle.type === 'hline') {
        editHandle.collection[editHandle.idx].price = p;
      } else {
        editHandle.collection[editHandle.idx][editHandle.point] = p;
        if (t !== null && editHandle.timeKey) editHandle.collection[editHandle.idx][editHandle.timeKey] = t;
      }
      redrawFibo();
    }
  } else if (touchDragging && dragStartPrice !== null) {
    const p = pixelToPrice(y), t = xToTime(x);
    if (p !== null && t !== null) {
      if (curTool === 'tline') {
        tlineDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t };
      } else {
        fiboDrag = { p1: dragStartPrice, p2: p, t1: dragStartTime, t2: t };
      }
      redrawFibo();
    }
  }
}, { passive: false });

fiboCanvas.addEventListener('touchend', e => {
  if (!fiboActive) return;
  clearTimeout(longPressTimer);
  if (editHandle) { editHandle = null; markDrawingsDirty(); redrawFibo(); }
  else if (touchDragging) {
    if (curTool === 'tline') {
      if (tlineDrag && Math.abs(tlineDrag.p2 - dragStartPrice) > 0.001) {
        tlineSaved.push({ ...tlineDrag }); markDrawingsDirty();
        editMode = true; editTarget = { type: 'tline', idx: tlineSaved.length - 1 };
        curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      } else { disableFiboMode(); }
      tlineDrag = null;
    } else {
      if (fiboDrag && Math.abs(fiboDrag.p2 - dragStartPrice) > 0.001) {
        fiboSaved.push({ ...fiboDrag }); markDrawingsDirty();
        editMode = true; editTarget = { type: 'fibo', idx: fiboSaved.length - 1 };
        curTool = ''; toolBtns.forEach(b => b.classList.remove('active'));
      } else { disableFiboMode(); }
      fiboDrag = null;
    }
    touchDragging = false; dragStartPrice = null; dragStartTime = null;
    redrawFibo();
  }
}, { passive: true });

// FIBOモード外でも長押しで削除メニュー（チャート全体）
chartDiv.addEventListener('touchstart', e => {
  if (fiboActive) return; // FIBOモード時は上の処理に任せる
  touchMoved = false;
  const t0 = e.touches[0];
  const rect = chartDiv.getBoundingClientRect();
  const x = t0.clientX - rect.left, y = t0.clientY - rect.top;
  longPressTimer = setTimeout(() => {
    if (!touchMoved) {
      const hit = hitDrawObject(x, y);
      if (hit) showDeleteMenu(t0.clientX, t0.clientY - 60, hit.idx, hit.type);
    }
  }, 500);
}, { passive: true });
chartDiv.addEventListener('touchmove', () => { touchMoved = true; clearTimeout(longPressTimer); }, { passive: true });
chartDiv.addEventListener('touchend',  () => clearTimeout(longPressTimer), { passive: true });

// ===== 右クリックで削除メニュー（PC） =====
fiboCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const hit = hitDrawObject(e.offsetX, e.offsetY);
  if (hit) showDeleteMenu(e.clientX, e.clientY, hit.idx, hit.type);
});
// ツールモード外でもチャート上で右クリック
chartDiv.addEventListener('contextmenu', e => {
  if (fiboActive) return;
  const rect = chartDiv.getBoundingClientRect();
  const hit = hitDrawObject(e.clientX - rect.left, e.clientY - rect.top);
  if (hit) { e.preventDefault(); showDeleteMenu(e.clientX, e.clientY, hit.idx, hit.type); }
});

// ===== FIBOモード外クリック/タッチで終了 =====
function handleFiboExit(e) {
  if (!fiboActive) return;
  const t = e.target;
  if ([...toolBtns].includes(t) || t === document.getElementById('btn-tool-clear')
      || fiboCanvas.contains(t) || deleteMenu.contains(t)) return;
  disableFiboMode();
}
document.addEventListener('click', handleFiboExit, true);
document.addEventListener('touchstart', handleFiboExit, true);

// ===== タッチ→マウス変換（チャート全体） =====
// klinecharts v9のmouseハンドラはPC同様に上下左右自由に動くが、
// タッチハンドラは横スクロールのみ。全タッチをマウスイベントに変換する。
(() => {
  let proxyActive = false;
  let lastTarget = null;

  function dispatchMouse(type, clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY) || lastTarget;
    if (!el) return;
    lastTarget = el;
    el.dispatchEvent(new MouseEvent(type, {
      clientX, clientY, button: 0,
      buttons: type === 'mouseup' ? 0 : 1,
      bubbles: true, cancelable: true
    }));
  }

  let lpTimer = null;
  let lpMoved = false;
  let startCX = 0, startCY = 0;

  chartDiv.addEventListener('touchstart', e => {
    if (fiboActive || e.touches.length !== 1) return;
    e.preventDefault();
    e.stopPropagation();
    proxyActive = true;
    lpMoved = false;
    const t = e.touches[0];
    startCX = t.clientX; startCY = t.clientY;
    const rect = chartDiv.getBoundingClientRect();
    const lx = t.clientX - rect.left, ly = t.clientY - rect.top;
    // 長押し検出（500ms）→ 描画オブジェクトがあれば編集モードに入る
    lpTimer = setTimeout(() => {
      if (!lpMoved) {
        const hit = hitDrawObject(lx, ly);
        if (hit) {
          proxyActive = false;
          dispatchMouse('mouseup', t.clientX, t.clientY);
          editMode = true;
          editTarget = { type: hit.type, idx: hit.idx };
          enableFiboMode(hit.type);
          return;
        }
      }
    }, 500);
    dispatchMouse('mousedown', t.clientX, t.clientY);
  }, { passive: false, capture: true });

  document.addEventListener('touchmove', e => {
    if (!proxyActive) return;
    const t = e.touches[0];
    // 少し動いただけでは長押しキャンセルしない（10px閾値）
    const dx = t.clientX - startCX, dy = t.clientY - startCY;
    if (dx*dx + dy*dy > 100) { lpMoved = true; clearTimeout(lpTimer); }
    e.preventDefault();
    dispatchMouse('mousemove', t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    clearTimeout(lpTimer);
    if (!proxyActive) return;
    proxyActive = false;
    const t = e.changedTouches[0];
    dispatchMouse('mouseup', t.clientX, t.clientY);
    lastTarget = null;
  }, { passive: true });

  document.addEventListener('touchcancel', () => {
    clearTimeout(lpTimer);
    proxyActive = false;
    lastTarget = null;
  }, { passive: true });
})();

// ===== MA =====
const MA_COLORS = ['#ff9800','#ab47bc','#42a5f5','#ef5350','#26a69a','#ffeb3b','#ec407a','#66bb6a','#78909c','#fff'];
const MA_DEFAULTS = [
  { period: 20, enabled: true, color: MA_COLORS[0], type: 'SMA' },
  { period: 50, enabled: true, color: MA_COLORS[1], type: 'SMA' },
  { period: 200, enabled: true, color: MA_COLORS[2], type: 'SMA' }
];
// 古いキーを掃除
localStorage.removeItem('maParams');
localStorage.removeItem('maSetting');
localStorage.removeItem('maConfigs');

let maLines;
try {
  const saved = JSON.parse(localStorage.getItem('maLines'));
  maLines = (Array.isArray(saved) && saved.length > 0) ? saved.map((m, i) => ({ ...m, type: m.type || 'SMA', color: MA_COLORS[i % MA_COLORS.length] })) : MA_DEFAULTS;
} catch(e) { maLines = MA_DEFAULTS; }

let _maInitDone = false;
function applyMA() {
  const active = maLines.filter(m => m.enabled);
  const params = active.length > 0 ? active.map(m => m.period) : [20, 50, 200];
  _maTypes = active.length > 0 ? active.map(m => m.type || 'SMA') : ['SMA','SMA','SMA'];
  if (!_maInitDone) {
    chart.createIndicator('CustomMA', false, { id: 'candle_pane' });
    _maInitDone = true;
  }
  chart.overrideIndicator({ name: 'CustomMA', calcParams: params }, 'candle_pane');
  // 色をグローバルスタイルで適用（安全）
  const colors = maLines.map(m => ({ color: m.enabled ? m.color : 'transparent', size: m.enabled ? 1 : 0 }));
  chart.setStyles({ indicator: { lines: colors } });
}

function renderMAList() {
  document.getElementById('ma-list').innerHTML = maLines.map((m, i) => {
    const c = m.color;
    return `<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;padding:4px 0">
      <input type="checkbox" ${m.enabled?'checked':''} data-mai="${i}" class="ma-chk" style="accent-color:${c}">
      <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c};flex-shrink:0"></span>
      <select data-mai="${i}" class="ma-type" style="background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:1px 2px;font-size:11px">
        <option value="SMA" ${(m.type||'SMA')==='SMA'?'selected':''}>MA</option>
        <option value="EMA" ${m.type==='EMA'?'selected':''}>EMA</option>
      </select>
      <input type="number" min="1" max="999" value="${m.period}" data-mai="${i}" class="ma-per" style="width:50px;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:12px;text-align:center">
      <button onclick="removeMALine(${i})" style="margin-left:auto;background:none;border:none;color:#484f58;font-size:14px;cursor:pointer;padding:0 4px;min-height:20px">✕</button>
    </div>`;
  }).join('');
}

function cycleMAColor(i) {
  const cur = MA_COLORS.indexOf(maLines[i].color);
  maLines[i].color = MA_COLORS[(cur + 1) % MA_COLORS.length];
  renderMAList();
}
function removeMALine(i) { maLines.splice(i, 1); saveAndApplyMA(); renderMAList(); }

function saveAndApplyMA() {
  localStorage.setItem('maLines', JSON.stringify(maLines));
  applyMA();
}

renderMAList();
applyMA();

// FVGトグル
document.getElementById('fvg-toggle').checked = fvgEnabled;
document.getElementById('fvg-toggle').addEventListener('change', e => {
  fvgEnabled = e.target.checked;
  localStorage.setItem('fvgEnabled', JSON.stringify(fvgEnabled));
  fvgCacheIdx = -1; // キャッシュ無効化
  redrawFibo();
});

document.getElementById('btn-settings').addEventListener('click', () => {
  const panel = document.getElementById('ma-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') renderMAList();
});
document.getElementById('ma-add').addEventListener('click', () => {
  const used = maLines.map(m => m.color);
  const next = MA_COLORS.find(c => !used.includes(c)) || MA_COLORS[maLines.length % MA_COLORS.length];
  maLines.push({ period: 20, enabled: true, color: next, type: 'SMA' });
  renderMAList();
});
document.getElementById('ma-apply').addEventListener('click', () => {
  // UIから値を読み取り
  document.querySelectorAll('.ma-per').forEach(el => {
    maLines[parseInt(el.dataset.mai)].period = parseInt(el.value) || 20;
  });
  document.querySelectorAll('.ma-chk').forEach(el => {
    maLines[parseInt(el.dataset.mai)].enabled = el.checked;
  });
  document.querySelectorAll('.ma-type').forEach(el => {
    maLines[parseInt(el.dataset.mai)].type = el.value;
  });
  saveAndApplyMA();
  document.getElementById('ma-panel').style.display = 'none';
});

// ===== キーボード =====
document.addEventListener('keydown', e => {
  if (e.key === ' ')          { e.preventDefault(); btnPlay.click(); }
  if (e.key === 'ArrowRight') advance(1);
  if (e.key === 'b' || e.key === 'B') document.getElementById('btn-buy').click();
  if (e.key === 's' || e.key === 'S') document.getElementById('btn-sell').click();
  // CLOSE ALLはボタンのみ（誤作動防止）
  if (e.key === 'f' || e.key === 'F') { enableFiboMode('fibo'); }
  if (e.key === 'Escape')     disableFiboMode();
});
</script>
